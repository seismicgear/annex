name: Published native Host acceptance

on:
  workflow_call:
    inputs:
      release_tag:
        type: string
        required: true
      subject_commit:
        type: string
        required: true
      candidate_run:
        type: string
        required: false
        default: ''
      architecture:
        type: string
        default: both
  workflow_dispatch:
    inputs:
      release_tag:
        description: Exact published installer release
        required: true
      subject_commit:
        description: Exact source recorded in downloads.json
        required: true
      candidate_run:
        description: Optional exact signed build run; empty requires published installers
        required: false
        default: ''
      architecture:
        description: Native architecture to exercise
        type: choice
        default: both
        options: [both, aarch64, x86_64]

permissions:
  contents: read
  actions: read

jobs:
  macos-host:
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON(inputs.architecture == 'aarch64' &&
          '[{"os":"macos-15","arch":"aarch64"}]' ||
          inputs.architecture == 'x86_64' &&
          '[{"os":"macos-15-intel","arch":"x86_64"}]' ||
          '[{"os":"macos-15","arch":"aarch64"},{"os":"macos-15-intel","arch":"x86_64"}]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      SUBJECT_COMMIT: ${{ inputs.subject_commit }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      CANDIDATE_RUN: ${{ inputs.candidate_run }}
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SUBJECT_COMMIT }}
          path: subject
          persist-credentials: false
      - name: Prepare independent direct transport probe
        run: |
          export PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/annex-playwright"
          echo "PLAYWRIGHT_BROWSERS_PATH=$PLAYWRIGHT_BROWSERS_PATH" >> "$GITHUB_ENV"
          npm --prefix client ci
          cd client
          npx playwright install chromium
      - name: Install exact public DMG without altering it
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          mkdir native-evidence
          sw_vers > native-evidence/macos-version.txt
          asset="annex-desktop-macos-${ASSET_ARCH}.dmg"
          if test -n "$CANDIDATE_RUN"; then
            python3 scripts/native-acceptance/macos/download-candidate.py "$RUNNER_TEMP/release" "$ASSET_ARCH"
          else
            python3 scripts/native-acceptance/macos/wait-release.py "$ASSET_ARCH"
            gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$asset" --pattern downloads.json --pattern SHA256SUMS --dir "$RUNNER_TEMP/release"
            python3 scripts/native-acceptance/macos/verify-download.py "$RUNNER_TEMP/release" "$ASSET_ARCH"
          fi
          hdiutil attach -readonly -nobrowse -mountpoint "$RUNNER_TEMP/annex-dmg" "$RUNNER_TEMP/release/$asset"
          test ! -e /Applications/Annex.app
          test ! -e "$HOME/Library/Application Support/Annex"
          python3 - <<'PY'
          import os, pathlib, pwd
          homes = {pathlib.Path.home(), pathlib.Path(pwd.getpwuid(os.stat('/dev/console').st_uid).pw_dir)}
          for home in homes:
              for relative in ('Library/Application Support/Annex', 'Library/Containers/com.annex.desktop/Data/Library/Application Support/Annex'):
                  assert not (home / relative).exists(), 'Native desktop account is not a fresh Host profile'
          PY
          ditto "$RUNNER_TEMP/annex-dmg/Annex.app" /Applications/Annex.app
          hdiutil detach "$RUNNER_TEMP/annex-dmg"
          python3 scripts/verify-macos-bundle.py /Applications/Annex.app --output native-evidence/installed-signature-verification.json
          shasum -a 256 /Applications/Annex.app/Contents/MacOS/* > native-evidence/installed-executable-sha256.txt
          if test -n "$CANDIDATE_RUN"; then python3 scripts/native-acceptance/macos/verify-array-installation.py; fi
      - name: Exercise ordinary desktop Host without provisioning a server for it
        run: |
          set -euo pipefail
          python3 scripts/native-acceptance/macos/observe-host.py &
          observer=$!
          python3 scripts/native-acceptance/macos/public-summary-worker.py &
          probe=$!
          trap 'kill "$observer" "$probe" 2>/dev/null || true' EXIT
          python3 scripts/native-acceptance/macos/make-project.py NativeHostAcceptance.swift
          xcodebuild -project scripts/native-acceptance/macos/NativeAcceptance.xcodeproj -scheme NativeAcceptance -destination 'platform=macOS' -resultBundlePath native-evidence/native-host.xcresult test | tee native-evidence/host-xcode-test.log
      - name: Export actual UI evidence
        if: always()
        run: |
          if test -d native-evidence/native-host.xcresult; then
            xcrun xcresulttool export attachments --path native-evidence/native-host.xcresult --output-path native-evidence/attachments
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-host-macos-${{ matrix.arch }}
          path: native-evidence/
          if-no-files-found: error
          retention-days: 14
