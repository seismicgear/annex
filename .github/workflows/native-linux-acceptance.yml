name: Exact Linux candidate installation

on:
  workflow_call:
    inputs:
      candidate_run:
        type: string
        required: true
      subject_commit:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      candidate_run:
        description: Exact completed Linux release build job
        required: true
      subject_commit:
        description: Source commit recorded in the native build
        required: true

permissions:
  contents: read
  actions: read

jobs:
  install:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Acquire and verify exact candidate bytes
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN: ${{ inputs.candidate_run }}
          SUBJECT_COMMIT: ${{ inputs.subject_commit }}
        run: |
          python3 scripts/native-acceptance/download-inventoried-candidate.py \
            --run "$CANDIDATE_RUN" --commit "$SUBJECT_COMMIT" --platform linux \
            --output candidate
          node --input-type=module -e 'import fs from "node:fs"; import { validateInventory } from "./scripts/array-release.mjs"; validateInventory(JSON.parse(fs.readFileSync("candidate/array-installation.json")));'
      - name: Install actual DEB and verify installed identity
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y xvfb xdotool imagemagick dbus-x11 libfuse2t64
          sudo apt-get install -y "$PWD/candidate/annex-desktop-linux-x86_64.deb"
          mkdir evidence
          cp candidate/acquisition.json candidate/array-installation.json evidence/
          dpkg-query --show annex | tee evidence/installed-package.txt
          python3 scripts/verify-linux-protocol.py --installed
          node --input-type=module -e 'import fs from "node:fs"; import { hashFile } from "./scripts/array-release.mjs"; const i=JSON.parse(fs.readFileSync("candidate/array-installation.json")); if ((await hashFile("/usr/bin/annex-desktop")).sha256!==i.artifacts.find(x=>x.kind==="deb").executableSha256) throw Error("Installed binary differs from Array identity");'
      - name: Launch both actual package formats and preserve data on uninstall
        run: |
          set -euo pipefail
          # A window plus a live native process is launch evidence, not Host,
          # messaging, physical media, or public-invitation acceptance.
          for kind in deb appimage; do
            profile="$RUNNER_TEMP/annex-$kind-profile"
            if test "$kind" = deb; then
              executable=/usr/bin/annex-desktop
            else
              executable="$PWD/candidate/annex-desktop-linux-x86_64.AppImage"
              chmod +x "$executable"
            fi
            export PROFILE="$profile" EXECUTABLE="$executable" KIND="$kind"
            dbus-run-session -- xvfb-run -a bash -eu -o pipefail <<'SH'
          "$EXECUTABLE" --profile-dir "$PROFILE" >"evidence/$KIND-launch.log" 2>&1 &
          app=$!
          trap 'kill "$app" 2>/dev/null || true; wait "$app" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 45); do
            kill -0 "$app"
            window=$(xdotool search --onlyvisible --pid "$app" --name Annex 2>/dev/null | head -1 || true)
            if test -n "$window"; then break; fi
            sleep 1
          done
          test -n "$window"
          sleep 5
          kill -0 "$app"
          import -window "$window" "evidence/$KIND-window.png"
          test -f "$PROFILE/.annex-profile.json"
          sha256sum "$PROFILE/.annex-profile.json" > "evidence/$KIND-profile.sha256"
          SH
          done
          sudo dpkg -r annex
          test ! -e /usr/bin/annex-desktop
          sha256sum --check evidence/deb-profile.sha256
          sha256sum --check evidence/appimage-profile.sha256
          printf '%s\n' '{"debInstalledHashVerified":true,"debWindowOpened":true,"appimageWindowOpened":true,"uninstallPreservedProfiles":true,"fullUserWorkflow":false}' > evidence/result.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: exact-linux-installation-evidence
          path: evidence/
          if-no-files-found: error
          retention-days: 14
