          {"path":"client/e2e/audit/baselines/narrow/voice-panel-disconnected.png","sha256":"6c1dccc0fe60c57fe3b300e261f7835d4b81079d8cd87c557f40709341e4b69e","blob_sha1":"0bb674db5af0bae53619e65cb85e5cbf7619bcff","bytes":55390},
          {"path":"client/e2e/audit/baselines/narrow/voice-panel-hybrid-channel.png","sha256":"a2dd305b610e381c00b164610c924a0d94b368ab8ede04e675017ea383c120b9","blob_sha1":"631875b62344faee7159d283be03f6aba79d171b","bytes":55447}]
          assert len(approved_rows) == 150
          approved = {row["path"]: row for row in approved_rows}
          assert len(approved) == 150, "Duplicate approved refresh path"
          assert len(before) == 404, "Unexpected pre-record reference count"

          def inventory():
              result = {}
              for file in sorted(refs.rglob("*.png")):
                  assert file.is_file() and not file.is_symlink(), str(file)
                  assert file.resolve(strict=True) == file, "Symlinked reference path: " + str(file)
                  result[file.relative_to(root).as_posix()] = hashlib.sha256(file.read_bytes()).hexdigest()
              return result

          assert inventory() == before, "Reference bytes or path inventory changed after before-hash capture"
          validated = []
          for name, row in approved.items():
              assert set(row) == {"path", "sha256", "blob_sha1", "bytes"}, name
              parts = pathlib.PurePosixPath(name).parts
              assert len(parts) == 6 and parts[:4] == ("client", "e2e", "audit", "baselines"), name
              assert parts[4] in {"desktop", "laptop", "narrow", "mobile"}, name
              assert re.fullmatch(r"[a-z0-9][a-z0-9-]*\.png", parts[5]), name
              assert pathlib.PurePosixPath(name).as_posix() == name, name
              file = root / name
              assert file.is_absolute() and file.is_relative_to(refs), name
              assert file.is_file() and not file.is_symlink(), name
              assert file.resolve(strict=True) == file, "Symlinked or outside reference: " + name
              data = file.read_bytes()
              digest = hashlib.sha256(data).hexdigest()
              assert name in before and before[name] == row["sha256"] == digest, "Unapproved preimage: " + name
              assert len(data) == row["bytes"], "Preimage byte count differs: " + name
              blob = hashlib.sha1(b"blob " + str(len(data)).encode() + b"\0" + data).hexdigest()
              assert blob == row["blob_sha1"], "Preimage Git blob differs: " + name
              validated.append((file, row))

          approved_receipt = {"sourceCommit": provenance["sourceCommit"], "sourceTree": provenance["sourceTree"],
                              "originalApprovedManifestSha256": approved_manifest_sha256,
                              "count": 150, "references": approved_rows}
          (out / "forced-refresh.approved.json").write_text(json.dumps(approved_receipt, indent=2) + "\n")
          receipt = {"sourceCommit": provenance["sourceCommit"], "sourceTree": provenance["sourceTree"],
                     "originalApprovedManifestSha256": approved_manifest_sha256,
                     "requestedCount": 150, "validatedCount": len(validated), "deleted": [], "status": "validated"}
          try:
              for file, row in validated:
                  assert file.is_file() and not file.is_symlink() and file.resolve(strict=True) == file, str(file)
                  assert hashlib.sha256(file.read_bytes()).hexdigest() == row["sha256"], str(file)
                  file.unlink()
                  receipt["deleted"].append({**row, "absolutePath": str(file)})
              remaining = inventory()
              expected_remaining = {name: digest for name, digest in before.items() if name not in approved}
              assert remaining == expected_remaining, "Refresh touched an unapproved reference or left an approved path"
              assert len(remaining) == 254
              receipt["remainingCount"] = len(remaining)
              receipt["status"] = "completed"
          finally:
              receipt["deletedCount"] = len(receipt["deleted"])
              (out / "forced-refresh.deleted.json").write_text(json.dumps(receipt, indent=2) + "\n")
          print(f"Verified and deleted exactly {receipt['deletedCount']} approved reference preimages; {receipt['remainingCount']} retained unchanged")
          PY

      - name: Record every surface against a fresh server
        id: record
        shell: bash
        run: |
          bash scripts/ui-audit.sh --update-baselines 2>&1 | tee "$ANNEX_UI_EVIDENCE/record.log"

      - name: Preserve recording evidence and validate candidate custody
        if: always()
        env:
          RECORD_OUTCOME: ${{ steps.record.outcome }}
          PROVENANCE_OUTCOME: ${{ steps.provenance.outcome }}
          REFRESH_OUTCOME: ${{ steps.refresh.outcome }}
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, shutil, subprocess
          root = pathlib.Path.cwd()
          out = pathlib.Path(os.environ["ANNEX_UI_EVIDENCE"])
          out.mkdir(parents=True, exist_ok=True)
          snapshot = out / "record"
          snapshot.mkdir(exist_ok=True)
          paths = ["docs/ui-audit", "client/e2e/audit/baselines",
                   "client/e2e/audit/captures", "client/e2e/audit/diagnostics",
                   "client/e2e-results", "client/e2e-report"]
          for name in paths:
              src, dest = root / name, snapshot / name
              if src.is_dir():
                  shutil.copytree(src, dest, dirs_exist_ok=True)
          errors = []
          def git(*args):
              return subprocess.check_output(["git", *args], text=True)
          hashes = {}
          for file in sorted((root / "client/e2e/audit/baselines").rglob("*.png")):
              if not file.is_file() or file.is_symlink():
                  errors.append("Non-regular reference: " + str(file))
                  continue
              hashes[file.relative_to(root).as_posix()] = hashlib.sha256(file.read_bytes()).hexdigest()
          (out / "baseline-hashes.recorded.json").write_text(json.dumps(hashes, indent=2) + "\n")
          changes = sorted(set(filter(None,
              git("diff", "--name-only", "-z", "HEAD").split("\0") +
              git("ls-files", "--others", "--exclude-standard", "-z").split("\0"))))
          def allowed(name):
              parts = pathlib.PurePosixPath(name).parts
              return (name in {"docs/ui-audit/findings.json", "docs/ui-audit/index.html"} or
                      (len(parts) == 6 and parts[:4] == ("client", "e2e", "audit", "baselines") and
                       parts[4] in {"desktop", "laptop", "narrow", "mobile"} and parts[5].endswith(".png")))
          unexpected = [name for name in changes if not allowed(name)]
          if unexpected:
              errors.append("Unexpected source changes: " + repr(unexpected))
          (out / "source-changes.after-record.json").write_text(json.dumps(changes, indent=2) + "\n")
          (out / "git-status.after-record.txt").write_text(git("status", "--short", "--untracked-files=all"))
          before_file = out / "baseline-hashes.before.json"
          if before_file.exists():
              expected = set(json.loads(before_file.read_text()))
              expected.update("client/e2e/audit/baselines/" + viewport + "/product-legal-notice.png"
                              for viewport in ["desktop", "laptop", "narrow", "mobile"])
              if len(hashes) != 408 or set(hashes) != expected:
                  errors.append("Recorded reference path inventory is incomplete or unexpected")
          else:
              errors.append("Missing before-record reference inventory")
          ledger = root / "docs/ui-audit/captured.jsonl"
          attempts = [json.loads(line) for line in ledger.read_text().splitlines() if line] if ledger.exists() else []
          pairs = {(item["surfaceId"], item["viewport"]) for item in attempts}
          expected_pairs = {(pathlib.PurePosixPath(name).stem, pathlib.PurePosixPath(name).parent.name)
                            for name in hashes}
          report_only = {"registration-progress", "reconnection-banner-disconnected"}
          capture_hashes = {}
          for file in sorted((root / "client/e2e/audit/captures").rglob("*.png")):
              if not file.is_file() or file.is_symlink():
                  errors.append("Non-regular report-only evidence: " + str(file))
                  continue
              capture_hashes[file.relative_to(root).as_posix()] = hashlib.sha256(file.read_bytes()).hexdigest()
          expected_capture_files = {"client/e2e/audit/captures/" + viewport + "/" + name + ".png"
                                    for name in report_only
                                    for viewport in ["desktop", "laptop", "narrow", "mobile"]}
          if set(capture_hashes) != expected_capture_files:
              errors.append("Report-only evidence inventory must contain the exact eight captures")
          (out / "report-only-capture-hashes.json").write_text(json.dumps(capture_hashes, indent=2) + "\n")
          expected_pairs.update((name, viewport) for name in report_only
                                for viewport in ["desktop", "laptop", "narrow", "mobile"])
          if len(attempts) != 416 or len(pairs) != 416 or pairs != expected_pairs:
              errors.append("Recording did not perform the complete unique surface/viewport sweep")
          font_file = root / "docs/ui-audit/font-environment.json"
          if font_file.exists():
              font = json.loads(font_file.read_text())
              if font.get("qualified") is not True:
                  errors.append("Final recording font qualification did not pass")
              shutil.copy2(font_file, out / "font-environment.recorded.json")
          else:
              errors.append("Missing recording font receipt")
          deletion_file = out / "forced-refresh.deleted.json"
          if not deletion_file.exists():
              errors.append("Missing approved reference deletion receipt")
          else:
              deletion = json.loads(deletion_file.read_text())
              if (deletion.get("status") != "completed" or deletion.get("requestedCount") != 150 or
                  deletion.get("validatedCount") != 150 or deletion.get("deletedCount") != 150 or
                  len(deletion.get("deleted", [])) != 150 or deletion.get("remainingCount") != 254):
                  errors.append("Approved reference deletion receipt is incomplete")
          outcome = {"record": os.environ.get("RECORD_OUTCOME"),
                     "refresh": os.environ.get("REFRESH_OUTCOME"),
                     "provenance": os.environ.get("PROVENANCE_OUTCOME"),
                     "verification": "pending subsequent full plain PR CI",
                     "referenceCount": len(hashes), "reportOnlyCaptureCount": len(capture_hashes),
                     "captureAttempts": len(attempts),
                     "uniqueCapturePairs": len(pairs), "sourceGuardErrors": errors}
          (out / "outcome.json").write_text(json.dumps(outcome, indent=2) + "\n")
          print(json.dumps(outcome, indent=2))
          if errors or any(outcome[name] != "success" for name in ["record", "provenance", "refresh"]):
              raise SystemExit(1)
          PY
          node scripts/baseline-drift.mjs > "$ANNEX_UI_EVIDENCE/baseline-drift.txt"

      - name: Upload complete candidate references and recording evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: annex-ui-baseline-recording-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/annex-ui-baseline-recording/
          retention-days: 30
          if-no-files-found: error
