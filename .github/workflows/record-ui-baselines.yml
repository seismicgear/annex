# Reviewed isolated recorder: source and exact refresh preimages are pinned.
# Root owns publication and triggering; this workflow never enters PR/main.
name: Record reviewed Annex UI baselines

on:
  push:
    branches:
      - codex/annex-ui-baseline-recording-20261108

permissions:
  contents: read

concurrency:
  group: annex-ui-baseline-recording-20261108
  cancel-in-progress: false

jobs:
  record:
    name: Full qualified UI baseline recording
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Set recording evidence path
        shell: bash
        run: |
          printf 'ANNEX_UI_EVIDENCE=%s/annex-ui-baseline-recording\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7
        with:
          ref: 746b4e2a5fcff53fec3a5060a8f1f7fd3a1daea9
          fetch-depth: 1
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@3fc1e40d4c4ce3007de028907c886bc3996ce2ea # 1.96.0
      - name: Verify native codec build tools
        run: cmake --version
      - name: Install Linux DSP binding compiler
        run: sudo apt-get update && sudo apt-get install -y libclang-dev
      - name: Verify native DSP binding compiler
        run: node scripts/verify-libclang.mjs
      - uses: Swatinem/rust-cache@v2
        with:
          key: ui-audit
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install client deps
        run: npm ci
        working-directory: client
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
        working-directory: client
      - name: Install UI audit font faces
        run: sudo apt-get install -y fontconfig fonts-dejavu-core fonts-dejavu-extra
      - name: Verify and install pinned ZK artifacts
        run: |
          npm ci
          node scripts/verify-artifacts.js --all --profile production
          node scripts/install-ceremony.js
        working-directory: zk
      - name: Qualify the recording fonts and browser
        run: node scripts/check-ui-audit-fonts.mjs

      - name: Capture exact source, environment, and reference inventory
        id: provenance
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, shutil, subprocess
          root = pathlib.Path.cwd()
          out = pathlib.Path(os.environ["ANNEX_UI_EVIDENCE"])
          out.mkdir(parents=True, exist_ok=True)
          def git(*args):
              return subprocess.check_output(["git", *args], text=True)
          head = git("rev-parse", "HEAD").strip()
          tree = git("rev-parse", "HEAD^{tree}").strip()
          assert head == "746b4e2a5fcff53fec3a5060a8f1f7fd3a1daea9", head
          assert tree == "8c31a4b006763ca861caf757e18133fe7bd9f869", tree
          assert not git("status", "--porcelain", "--untracked-files=all"), "Checkout changed before recording"
          refs = root / "client/e2e/audit/baselines"
          hashes = {}
          for file in sorted(refs.rglob("*.png")):
              assert file.is_file() and not file.is_symlink(), str(file)
              hashes[file.relative_to(root).as_posix()] = hashlib.sha256(file.read_bytes()).hexdigest()
          tracked = {name for name in git("ls-files", "-z", "client/e2e/audit/baselines").split("\0") if name.endswith(".png")}
          assert set(hashes) == tracked, "Baseline inventory differs from tracked reference files"
          assert len(hashes) == 404, "Reviewed source must contain exactly 404 reference PNGs"
          (out / "baseline-hashes.before.json").write_text(json.dumps(hashes, indent=2) + "\n")
          (out / "source-tree.txt").write_text(git("ls-tree", "-r", "HEAD"))
          font = json.loads((root / "docs/ui-audit/font-environment.json").read_text())
          assert font["qualified"] is True, font
          shutil.copy2(root / "docs/ui-audit/font-environment.json", out / "font-environment.before.json")
          env_names = ["GITHUB_REPOSITORY", "GITHUB_RUN_ID", "GITHUB_RUN_ATTEMPT",
                       "GITHUB_WORKFLOW_REF", "GITHUB_WORKFLOW_SHA", "GITHUB_REF", "GITHUB_SHA",
                       "RUNNER_OS", "RUNNER_ARCH", "RUNNER_NAME", "ImageOS", "ImageVersion"]
          provenance = {"sourceCommit": head, "sourceTree": tree,
                        "environment": {name: os.environ.get(name) for name in env_names},
                        "osRelease": pathlib.Path("/etc/os-release").read_text(),
                        "recordCommand": "bash scripts/ui-audit.sh --update-baselines",
                        "verificationStage": "Full plain UI audit in subsequent normal PR CI",
                        "baselineCountBefore": len(hashes)}
          (out / "provenance.json").write_text(json.dumps(provenance, indent=2) + "\n")
          PY
          rustc --version --verbose > "$ANNEX_UI_EVIDENCE/toolchain.txt"
          cargo --version >> "$ANNEX_UI_EVIDENCE/toolchain.txt"
          node --version >> "$ANNEX_UI_EVIDENCE/toolchain.txt"
          npm --version >> "$ANNEX_UI_EVIDENCE/toolchain.txt"
          (cd client && npx playwright --version) >> "$ANNEX_UI_EVIDENCE/toolchain.txt"

