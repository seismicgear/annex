name: Published native invite acceptance

on:
  push:
    branches: [codex/native-invite-acceptance-20261015]
    paths: ['scripts/native-acceptance/**', '.github/workflows/native-invite-acceptance.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-session:
    name: Native session (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: aarch64
            sha256: d89ecfb00859ba6fc41423dc716092b1c05adc854097725e092123fe993f3d14
          - os: macos-15-intel
            arch: x86_64
            sha256: 2bcd9c14e8b9ccf8f7dea5583c41bdabbf1455dbd983235513ec1a20ace5ea89
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Record actual desktop environment
        run: |
          mkdir -p native-evidence
          sw_vers > native-evidence/macos-version.txt
          uname -m > native-evidence/architecture.txt
          stat -f '%Su' /dev/console > native-evidence/console-user.txt
          xcodebuild -version > native-evidence/xcode-version.txt
      - name: Retrieve and install exact published DMG
        env:
          EXPECTED_SHA256: ${{ matrix.sha256 }}
          ASSET_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          asset="annex-desktop-macos-${ASSET_ARCH}.dmg"
          curl --fail --location --retry 3 "https://github.com/seismicgear/annex/releases/download/v0.1.0/${asset}" --output "$RUNNER_TEMP/$asset"
          printf '%s  %s\n' "$EXPECTED_SHA256" "$RUNNER_TEMP/$asset" | shasum -a 256 --check | tee native-evidence/published-dmg-check.txt
          hdiutil attach -readonly -nobrowse -mountpoint "$RUNNER_TEMP/annex-dmg" "$RUNNER_TEMP/$asset" | tee native-evidence/dmg-mount.txt
          test ! -e /Applications/Annex.app
          ditto "$RUNNER_TEMP/annex-dmg/Annex.app" /Applications/Annex.app
          hdiutil detach "$RUNNER_TEMP/annex-dmg"
          codesign --verify --deep --strict --verbose=2 /Applications/Annex.app 2> native-evidence/installed-signature-check.txt
          shasum -a 256 /Applications/Annex.app/Contents/MacOS/* > native-evidence/installed-executable-sha256.txt
          plutil -p /Applications/Annex.app/Contents/Info.plist > native-evidence/installed-info-plist.txt
      - name: Exercise native Safari session
        run: |
          set -euo pipefail
          python3 scripts/native-acceptance/macos/make-project.py
          xcodebuild -project scripts/native-acceptance/macos/NativeAcceptance.xcodeproj -scheme NativeAcceptance -destination 'platform=macOS' -resultBundlePath native-evidence/native-session.xcresult test | tee native-evidence/xcode-test.log
      - name: Preserve actual native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-session-macos-${{ matrix.arch }}
          path: native-evidence/
          if-no-files-found: error
          retention-days: 14
