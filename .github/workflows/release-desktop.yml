name: Release Desktop App

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Prove the pipeline without tagging: builds everything and creates a draft release named dry-run-<sha>"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      unsigned_dry_run:
        description: "Build WITHOUT updater signing keys. The only way to get an unsigned build; refused on a tag."
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

env:
  CARGO_TERM_COLOR: always
  # `production` makes scripts/build-desktop.js call zk/scripts/verify-artifacts.js
  # against the pinned manifest. Refusing to skip is the whole point of release.
  ANNEX_BUILD_PROFILE: production
  ANNEX_UNSIGNED_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.unsigned_dry_run || 'false' }}

jobs:
  # ── Cheap gates, before 30-60 minutes of Tauri builds ─────────────────────
  #
  # Both of these were written, both pass, and both ran in no release path.
  # Running them here rather than only in `release` matters: a mismatched tag or
  # a dev-fixture proving key would otherwise be discovered after two Tauri
  # builds and a `cargo install tauri-cli` had burned.
  #
  # Deliberately NOT `if: startsWith(github.ref, 'refs/tags/')`. The comment in
  # the `release` job records that the dry-run path once enforced LESS than the
  # tag path; a conditional gate is how that asymmetry comes back somewhere new.
  preflight:
    name: Pre-flight gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Ties the tag to the version. Nothing did: a `v0.2.0` tag pushed against
      # a tree at `0.1.0` produced a release named v0.2.0 whose `latest.json`
      # advertised 0.1.0 to every updater that polled it. Also fails a missing
      # CHANGELOG section for the version being shipped.
      - name: Version, tag and CHANGELOG agree
        run: bash scripts/tests/version-sync.test.sh

      # Decides whether a release can ship dev-fixture proving keys.
      # `release-gates.md` claimed this ran in ci.yml's globbed harness step;
      # that step matches `scripts/tests/*.test.sh` and this is `scripts/*.sh`,
      # so it matched nothing. Needs `node` for verify-artifacts.js, hence the
      # setup-node above.
      - name: Production ZK provenance gate
        run: sh scripts/verify-production-rejects-dev-fixtures.sh

      - name: Install Rust toolchain for dependency security gate
        uses: dtolnay/rust-toolchain@3fc1e40d4c4ce3007de028907c886bc3996ce2ea # 1.96.0

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: dependency-security
          workspaces: scripts/security-regressions -> target

      - name: Verify dependency source, runtime regressions, and audit
        run: |
          sudo apt-get update && sudo apt-get install -y libglib2.0-dev pkg-config
          bash scripts/check-dependency-security.sh

      - name: Desktop resource safety checks
        run: node --test scripts/tests/desktop-assets.test.mjs scripts/tests/pinned-git-source.test.mjs scripts/tests/desktop-release.test.mjs scripts/tests/macos-piper.test.mjs scripts/tests/windows-runtime.test.mjs scripts/tests/release-write-eligibility.test.mjs

      - name: Require production updater signing credentials
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PUBLIC_KEY: ${{ secrets.TAURI_SIGNING_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          if [ "${ANNEX_UNSIGNED_DRY_RUN}" = "true" ]; then
            [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ] || exit 1
            echo "Explicit unsigned draft only; no updater or public release is qualified."
          else
            [ -n "${TAURI_SIGNING_PRIVATE_KEY}" ] && [ -n "${TAURI_SIGNING_PUBLIC_KEY}" ] || { echo "::error::Production updater signing credentials are missing."; exit 1; }
          fi

  # ── The server, which had no release artifact at all ──────────────────────
  #
  # The only release pipeline in this repository built the DESKTOP app. An
  # operator who wanted to run a server had `docker build` from source and
  # nothing else: no binary, no tarball, no published image. This produces the
  # tarball; the image is a separate concern and is not attempted here (see
  # CHANGELOG).
  #
  # The contents are not just the binary, and the reason is a consequence of two
  # of this session's own changes:
  #
  #   * `zk/keys/` is gitignored — the production vkeys are installed from
  #     `zk/artifacts/` by `install-ceremony.js`, which re-hashes each file after
  #     it lands. With the default `enabled_zk_versions = ["v2"]` a missing
  #     `membership_v2_vkey.json` is a hard startup error, not a degraded mode.
  #   * `assets/embedding/` is gitignored too, and a production-profile server
  #     REFUSES TO START without the alignment model. A tarball without it is a
  #     tarball that cannot boot under the profile it is built for.
  #
  # Migrations need no packaging: they are `include_str!`-ed into the binary.
  build-server:
    name: Build (server tarball)
    needs: preflight
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install native speech codec build tools
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential libclang-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@3fc1e40d4c4ce3007de028907c886bc3996ce2ea # 1.96.0

      - name: Verify native codec build tools
        run: cmake --version

      - name: Install Linux DSP binding compiler
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libclang-dev

      - name: Verify native DSP binding compiler
        run: node scripts/verify-libclang.mjs

      - uses: Swatinem/rust-cache@v2
        with:
          key: server-release

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Hash-checked on the way in and re-hashed on the way out.
      - name: Install ceremony-produced ZK artifacts
        run: node zk/scripts/install-ceremony.js

      - name: Fetch the pinned VRP alignment model
        run: bash scripts/setup-embedding-model.sh

      - name: Build the server
        run: cargo build --release -p annex-server

      - name: Assemble the tarball
        run: |
          set -euo pipefail
          version=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          stage="annex-server-${version}-x86_64-unknown-linux-gnu"
          mkdir -p "dist/${stage}"/{zk/keys,assets/embedding}
          cp target/release/annex-server "dist/${stage}/"
          cp zk/keys/*_vkey.json "dist/${stage}/zk/keys/"
          cp assets/embedding/* "dist/${stage}/assets/embedding/"
          cp README.md LICENSE.md THIRD_PARTY_NOTICES.md "dist/${stage}/"
          cp docs/deployment.md "dist/${stage}/DEPLOYMENT.md"

          # A tarball that cannot start is not a release artifact, and "it
          # compiled" does not answer that. `--check` runs the whole of
          # `prepare_server` and exits, so this fails if the vkeys or the
          # alignment model did not make it in. Verified locally both ways:
          # removing `assets/embedding/model.safetensors` gives
          # `UnusableAlignmentModel`, removing `zk/keys/membership_v2_vkey.json`
          # gives `MissingVerificationKey`, each naming the file.
          #
          # A REAL random key. A production profile rejects a single-byte fill as
          # a weak key, so `'ab' * 32` — the obvious placeholder, and the one I
          # wrote first — fails this step for a reason that has nothing to do
          # with the tarball.
          (
            cd "dist/${stage}"
            ANNEX_BUILD_PROFILE=production \
            ANNEX_CORS_ORIGINS=https://example.invalid \
            ANNEX_SIGNING_KEY=$(python3 -c "import secrets; print(secrets.token_hex(32))") \
            ANNEX_DB_PATH=./smoke.db \
            ANNEX_PORT=0 \
            ./annex-server --check
          )
          rm -f "dist/${stage}/smoke.db"*

          tar -C dist -czf "annex-server-${version}-x86_64-unknown-linux-gnu.tar.gz" "${stage}"
          sha256sum "annex-server-${version}-x86_64-unknown-linux-gnu.tar.gz"

      - name: Upload the server tarball
        uses: actions/upload-artifact@v4
        with:
          name: server-linux-x86_64
          path: annex-server-*.tar.gz
          if-no-files-found: error

  # ── The server container image ───────────────────────────────────────────
  #
  # `docs/RELEASING.md` said "there is no published container image yet" and
  # `docker-compose.prod.yml` named a locally-built tag, so the documented
  # production deployment path ended at "build it yourself" while the desktop
  # app had a signed, checksummed, SBOM'd release pipeline. The Dockerfile was
  # already the strict half of that story — it verifies all five ZK manifests,
  # runs the ceremony verifier, installs the VERIFIED bytes rather than whatever
  # is in `zk/keys`, and pins every download by digest — and none of it was ever
  # built by CI.
  #
  # Build always, push only on a tag. A dispatch proves the Dockerfile still
  # builds and that the image STARTS, without publishing anything: publishing is
  # not reversible, and a dry run that pushes is not a dry run.
  build-image:
    name: Build (server container image)
    needs: preflight
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # This build compiles the Rust workspace in release mode, builds
      # whisper.cpp from source and bundles the client, in one context. A
      # standard runner has ~14 GB free and the toolcaches nothing here uses
      # account for several of them.
      - name: Reclaim runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - uses: docker/setup-buildx-action@v3

      - name: Resolve the image reference
        id: img
        run: |
          set -euo pipefail
          version=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          repo=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "ref=ghcr.io/${repo}:${version}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      # `load: true`, not `push: true`, even on a tag — the image has to be in
      # the local daemon for the start check below, and an image is pushed only
      # after something has run it.
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: ${{ steps.img.outputs.ref }}
          build-args: |
            ANNEX_BUILD_PROFILE=production
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The same question the tarball answers, asked of the image: does it
      # START? `--check` runs the whole of `prepare_server` — config validation,
      # the production-profile gates, the signing key, the v2 vkeys, the pinned
      # alignment model, the migrations — and exits without serving. An image
      # that built but omitted a vkey or the model passes every other check in
      # this workflow and fails on an operator's machine.
      #
      # A real random signing key: a production profile rejects a single-byte
      # fill as weak, so a placeholder fails this step for a reason that has
      # nothing to do with the image.
      - name: Prove the image starts
        run: |
          set -euo pipefail
          docker run --rm \
            --entrypoint /app/annex-server \
            -e ANNEX_BUILD_PROFILE=production \
            -e ANNEX_CORS_ORIGINS=https://example.invalid \
            -e ANNEX_SIGNING_KEY="$(python3 -c 'import secrets; print(secrets.token_hex(32))')" \
            -e ANNEX_DB_PATH=/tmp/check.db \
            -e ANNEX_PORT=0 \
            "${{ steps.img.outputs.ref }}" --check

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Only the exact version, never `latest`. The GitHub Release this workflow
      # produces is a DRAFT that a human publishes; moving `latest` here would
      # hand every `docker pull` a version nobody had yet decided to ship.
      # `docs/RELEASING.md` records moving it as a step after publishing.
      - name: Push the image
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          docker push "${{ steps.img.outputs.ref }}"
          echo "pushed ${{ steps.img.outputs.ref }}"

  # Required platforms: Linux, Windows and both macOS architectures.
  build-linux:
    name: Build (Linux x86_64, required)
    needs: preflight
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@3fc1e40d4c4ce3007de028907c886bc3996ce2ea # 1.96.0
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Verify native codec build tools
        run: cmake --version

      - name: Install Linux DSP binding compiler
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libclang-dev

      - name: Verify native DSP binding compiler
        run: node scripts/verify-libclang.mjs

      - uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-unknown-linux-gnu

      # Tauri 2 ships against webkit2gtk-4.1, NOT 4.0. The package for the
      # JavaScriptCore bindings has the `lib` prefix on Ubuntu — without it
      # the install fails with "Unable to locate package javascriptcoregtk-4.1-dev".
      # `xdg-desktop-portal` is a runtime portal, not a build-time dep, so we
      # do NOT install it here (and `libxdg-desktop-portal-dev` doesn't exist).
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libclang-dev \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libpipewire-0.3-dev \
            patchelf desktop-file-utils

      - name: Verify WebKitGTK version (>= 2.40 required for WebRTC)
        run: |
          version=$(pkg-config --modversion webkit2gtk-4.1)
          echo "WebKitGTK version: $version"
          major=$(echo "$version" | cut -d. -f1)
          minor=$(echo "$version" | cut -d. -f2)
          if [ "$major" -lt 2 ] || { [ "$major" -eq 2 ] && [ "$minor" -lt 40 ]; }; then
            echo "::error::WebKitGTK $version is too old. WebRTC requires >= 2.40."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            zk/package-lock.json

      # Production builds REQUIRE pinned ZK artifacts that match the manifest
      # SHA-256 hashes. We do NOT regenerate keys here — the manifest +
      # tracked-in-git artifacts are the source of truth.
      #
      # `--all` rather than a bare invocation: the bare form defaults to the
      # `membership` manifest alone, and the DEFAULT identity path is
      # membership_v2. Gating one circuit of six let the other five reach a
      # bundle unverified.
      #
      # The dev-fixture bypass env var is deliberately absent from this
      # workflow; scripts/verify-production-rejects-dev-fixtures.sh asserts
      # that it stays absent, and that this step still says `--all`.
      # `verify-ceremony.js` needs zk/node_modules.
      #
      # It shells out to `zk/node_modules/snarkjs/build/cli.cjs` for
      # `zkey verify`, and requires `@noble/curves` to check the drand beacon's
      # BLS signature. Neither exists on a clean runner. Configuring an npm
      # CACHE — which the Setup Node step above does — does not create the
      # directory; it only makes populating it faster. So the verification step
      # that the release contract rests on could not run at all.
      #
      # `verify-artifacts.js` needs none of this (it only hashes files), which
      # is why the gap survived: the cheap gate passed and the expensive one
      # was never reached.
      - name: Install ZK dependencies
        run: npm ci
        working-directory: zk

      - name: Verify pinned ZK artifacts
        run: node scripts/verify-artifacts.js --all
        working-directory: zk

      # Hashes prove the files have not changed since the ceremony. They do
      # not prove a ceremony happened. `zkey verify` walks r1cs → ptau →
      # every contribution → beacon, and the beacon is checked against the
      # drand round the transcript committed to before that round existed.
      - name: Verify the ZK ceremony
        run: node scripts/verify-ceremony.js
        working-directory: zk

      - name: Prepare pinned desktop speech and embedding resources
        # Resource source checkouts must not inherit mutable build leftovers
        # restored from the Cargo target cache. Each runner gets a fresh area.
        run: node scripts/prepare-desktop-assets.mjs --target x86_64-unknown-linux-gnu --work-dir "${{ runner.temp }}/annex-desktop-assets"

      - name: Verify complete desktop resource inventory
        run: node scripts/prepare-desktop-assets.mjs --verify --target x86_64-unknown-linux-gnu

      - name: Install and authenticate pinned official Tauri CLI
        working-directory: tools/tauri-cli
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm audit signatures
          node node_modules/@tauri-apps/cli/tauri.js --version

      - name: Build Tauri app (Linux)
        working-directory: crates/annex-desktop
        run: |
          set -euo pipefail
          # Updater artifacts exist only when there is a key to sign them with.
          #
          # `createUpdaterArtifacts` is NOT committed in tauri.conf.json and the
          # public key is NOT in the repository. The pubkey is the operator's
          # half of their own signing key; a value baked into the tree would
          # either be a placeholder that produces unverifiable updates, or a key
          # whose private half somebody else holds. It is injected here with
          # `--config`, from a repository secret, so the committed config stays
          # truthful about what it can prove.
          if [ "${ANNEX_UNSIGNED_DRY_RUN}" != "true" ] && [ -n "${TAURI_SIGNING_PUBLIC_KEY:-}" ]; then
            echo "Signing key configured — building updater artifacts."
            CONFIG=$(printf '{"bundle":{"createUpdaterArtifacts":true},"plugins":{"updater":{"pubkey":"%s","endpoints":["%s"]}}}' \
              "${TAURI_SIGNING_PUBLIC_KEY}" "${ANNEX_UPDATER_ENDPOINT}")
          else
            echo "No TAURI_SIGNING_PUBLIC_KEY — building WITHOUT updater artifacts."
            echo "The release job refuses this unless unsigned_dry_run was set."
            CONFIG='{}'
          fi
          node ../../tools/tauri-cli/node_modules/@tauri-apps/cli/tauri.js build --verbose --target x86_64-unknown-linux-gnu --config "${CONFIG}"
        env:
          # linuxdeploy's bundled strip predates modern ELF RELR sections in
          # WebKitGTK's dependencies. Preserve them instead of rewriting them
          # with that tool; the Rust release profile still optimizes the app.
          # https://github.com/tauri-apps/tauri/issues/14796
          NO_STRIP: "true"
          # linuxdeploy scans every bundled ELF, including eSpeak; resolve the
          # shared libraries from the same pinned Piper archive.
          LD_LIBRARY_PATH: ${{ github.workspace }}/assets/piper
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_SIGNING_PUBLIC_KEY: ${{ secrets.TAURI_SIGNING_PUBLIC_KEY }}
          ANNEX_UPDATER_ENDPOINT: ${{ vars.ANNEX_UPDATER_ENDPOINT || 'https://github.com/seismicgear/annex/releases/latest/download/latest.json' }}

      - name: Verify actual Linux bundle URL handlers
        run: |
          sudo apt-get install -y squashfs-tools
          python3 scripts/tests/linux-protocol.test.py
          rustc --test --edition 2021 crates/annex-desktop/src/appimage_protocol.rs -o "$RUNNER_TEMP/annex-appimage-protocol-tests"
          "$RUNNER_TEMP/annex-appimage-protocol-tests"
          python3 scripts/verify-linux-protocol.py --deb target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb --appimage target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: annex-linux-x86_64
          path: |
            target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
            target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
            target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage.sig
          if-no-files-found: error

  build-windows:
    needs: preflight
    name: Build (Windows x86_64, required)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@3fc1e40d4c4ce3007de028907c886bc3996ce2ea # 1.96.0
        with:
          targets: x86_64-pc-windows-msvc

      - name: Verify native codec build tools
        run: cmake --version

      - name: Install Linux DSP binding compiler
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libclang-dev

      - name: Verify native DSP binding compiler
        run: node scripts/verify-libclang.mjs

      - uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-pc-windows-msvc

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            zk/package-lock.json

      - name: Verify Visual Studio C++ workload
        run: |
          & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * `
            -requires Microsoft.VisualStudio.Workload.NativeDesktop `
            -property installationPath
        shell: pwsh

      # See the Linux job: verify-ceremony.js needs zk/node_modules, and an
      # npm cache is not the same thing as an install.
      - name: Install ZK dependencies
        shell: bash
        run: npm ci
        working-directory: zk

      - name: Verify pinned ZK artifacts
        shell: bash
        run: node scripts/verify-artifacts.js --all
        working-directory: zk

      - name: Verify the ZK ceremony
        shell: bash
        run: node scripts/verify-ceremony.js
        working-directory: zk

      - name: Prepare pinned desktop speech and embedding resources
        shell: pwsh
        run: ./scripts/prepare-desktop-assets.ps1 -WorkDir (Join-Path $env:RUNNER_TEMP 'annex-desktop-assets')

      - name: Verify complete desktop resource inventory
        run: node scripts/prepare-desktop-assets.mjs --verify --target x86_64-pc-windows-msvc

      - name: Install and authenticate pinned official Tauri CLI
        working-directory: tools/tauri-cli
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm audit signatures
          node node_modules/@tauri-apps/cli/tauri.js --version

      - name: Build Tauri app (Windows)
        working-directory: crates/annex-desktop
        shell: bash
        run: |
          set -euo pipefail
          # See the Linux job for why the pubkey is injected rather than
          # committed.
          if [ "${ANNEX_UNSIGNED_DRY_RUN}" != "true" ] && [ -n "${TAURI_SIGNING_PUBLIC_KEY:-}" ]; then
            echo "Signing key configured — building updater artifacts."
            CONFIG=$(printf '{"bundle":{"createUpdaterArtifacts":true},"plugins":{"updater":{"pubkey":"%s","endpoints":["%s"]}}}' \
              "${TAURI_SIGNING_PUBLIC_KEY}" "${ANNEX_UPDATER_ENDPOINT}")
          else
            echo "No TAURI_SIGNING_PUBLIC_KEY — building WITHOUT updater artifacts."
            CONFIG='{}'
          fi
          node ../../tools/tauri-cli/node_modules/@tauri-apps/cli/tauri.js build --verbose --target x86_64-pc-windows-msvc --config "${CONFIG}"
        env:
          CMAKE_ARGS: -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_SIGNING_PUBLIC_KEY: ${{ secrets.TAURI_SIGNING_PUBLIC_KEY }}
          ANNEX_UPDATER_ENDPOINT: ${{ vars.ANNEX_UPDATER_ENDPOINT || 'https://github.com/seismicgear/annex/releases/latest/download/latest.json' }}

      - name: Preserve Windows installer compilation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-compilation
          path: |
            target/x86_64-pc-windows-msvc/release/wix/**/*.wxs
            target/x86_64-pc-windows-msvc/release/wix/**/*.wxl
            target/x86_64-pc-windows-msvc/release/wix/**/*.wixobj
          if-no-files-found: ignore
          retention-days: 14

      - name: Verify Windows native runtime closure
        run: node scripts/windows-runtime.mjs --directory target/x86_64-pc-windows-msvc/release

      - name: Verify authenticated WebView2 installer prerequisites
        shell: pwsh
        run: ./scripts/verify-webview2-bundle.ps1 -BuildDir target/x86_64-pc-windows-msvc/release -RequireMsi

      - name: Exercise Windows installer prerequisite failures and repairs
        shell: pwsh
        run: |
          $resultFile = Join-Path $env:RUNNER_TEMP ('annex-webview2-package-' + [Guid]::NewGuid().ToString('N') + '.txt')
          ./scripts/tests/webview2-installers.test.ps1 -Mode Build -ScratchDir $env:RUNNER_TEMP -ResultFile $resultFile
          $package = [IO.File]::ReadAllText($resultFile).Trim()
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $package 'run-tests.ps1') -Mode Run -PackageDirectory $package
          if ($LASTEXITCODE -ne 0) { throw 'Windows prerequisite installer regression failed.' }

      - name: Preserve Windows prerequisite regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-prerequisite-regression
          path: C:/AnnexWebViewFixture/evidence/
          if-no-files-found: warn

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: annex-windows-x86_64
          path: |
            target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
            target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe.sig
            target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi.sig
            target/x86_64-pc-windows-msvc/release/windows-native-closure.json
            target/x86_64-pc-windows-msvc/release/windows-webview2-closure.json
          if-no-files-found: error

  # Both Mac architectures are advertised publicly, so both are required.
  build-macos:
    needs: preflight
    name: Build (macOS, required)
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch: aarch64
            runner: macos-15
          - target: x86_64-apple-darwin
            arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@3fc1e40d4c4ce3007de028907c886bc3996ce2ea # 1.96.0
        with:
          targets: ${{ matrix.target }}

      - name: Verify native codec build tools
        run: cmake --version

      - name: Install Linux DSP binding compiler
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libclang-dev

      - name: Verify native DSP binding compiler
        run: node scripts/verify-libclang.mjs

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            zk/package-lock.json

      # `verify-ceremony.js` needs zk/node_modules.
      #
      # It shells out to `zk/node_modules/snarkjs/build/cli.cjs` for
      # `zkey verify`, and requires `@noble/curves` to check the drand beacon's
      # BLS signature. Neither exists on a clean runner. Configuring an npm
      # CACHE — which the Setup Node step above does — does not create the
      # directory; it only makes populating it faster. So the verification step
      # that the release contract rests on could not run at all.
      #
      # `verify-artifacts.js` needs none of this (it only hashes files), which
      # is why the gap survived: the cheap gate passed and the expensive one
      # was never reached.
      - name: Install ZK dependencies
        run: npm ci
        working-directory: zk

      - name: Verify pinned ZK artifacts
        run: node scripts/verify-artifacts.js --all
        working-directory: zk

      - name: Verify the ZK ceremony
        run: node scripts/verify-ceremony.js
        working-directory: zk

      - name: Prepare pinned desktop speech and embedding resources
        run: node scripts/prepare-desktop-assets.mjs --target ${{ matrix.target }} --work-dir "${{ runner.temp }}/annex-desktop-assets"

      - name: Verify complete desktop resource inventory
        run: node scripts/prepare-desktop-assets.mjs --verify --target ${{ matrix.target }}

      - name: Install and authenticate pinned official Tauri CLI
        working-directory: tools/tauri-cli
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm audit signatures
          node node_modules/@tauri-apps/cli/tauri.js --version

      - name: Build Tauri app (macOS)
        working-directory: crates/annex-desktop
        run: |
          set -euo pipefail
          # See the Linux job for why the pubkey is injected rather than
          # committed.
          if [ "${ANNEX_UNSIGNED_DRY_RUN}" != "true" ] && [ -n "${TAURI_SIGNING_PUBLIC_KEY:-}" ]; then
            echo "Signing key configured — building updater artifacts."
            CONFIG=$(printf '{"bundle":{"createUpdaterArtifacts":true},"plugins":{"updater":{"pubkey":"%s","endpoints":["%s"]}}}' \
              "${TAURI_SIGNING_PUBLIC_KEY}" "${ANNEX_UPDATER_ENDPOINT}")
          else
            echo "No TAURI_SIGNING_PUBLIC_KEY — building WITHOUT updater artifacts."
            CONFIG='{}'
          fi
          node ../../tools/tauri-cli/node_modules/@tauri-apps/cli/tauri.js build --target ${{ matrix.target }} --config "${CONFIG}"
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_SIGNING_PUBLIC_KEY: ${{ secrets.TAURI_SIGNING_PUBLIC_KEY }}
          ANNEX_UPDATER_ENDPOINT: ${{ vars.ANNEX_UPDATER_ENDPOINT || 'https://github.com/seismicgear/annex/releases/latest/download/latest.json' }}

      - name: Verify sealed macOS application and embedded code
        run: |
          python3 scripts/verify-macos-bundle.py "target/${{ matrix.target }}/release/bundle/macos/Annex.app" \
            --output "target/${{ matrix.target }}/release/macos-signature-verification.json"

      - name: Preserve macOS signature verification
        uses: actions/upload-artifact@v4
        with:
          name: macos-signature-${{ matrix.arch }}
          path: target/${{ matrix.target }}/release/macos-signature-verification.json
          if-no-files-found: error

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: annex-macos-${{ matrix.arch }}
          path: |
            target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz
            target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz.sig
            target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error

  # Draft assembly waits for every publicly advertised platform.
  release:
    needs: [build-linux, build-windows, build-macos, build-server, build-image]
    runs-on: ubuntu-latest
    # A tag publishes; a dispatch with dry_run proves the pipeline without one.
    # Before this, the only way to find out whether the release job worked was
    # to push a tag — which is the one action you cannot take back.
    if: >-
      startsWith(github.ref, 'refs/tags/') ||
      (github.event_name == 'workflow_dispatch' && inputs.dry_run == 'true')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          # BuildKit's .dockerbuild summary is not an archive for this action.
          pattern: '!*.dockerbuild'
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f | sort

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Again here, and not only in `preflight`. A `workflow_dispatch` dry run
      # reaches this job, and a gate that can be reached by a path that skips it
      # is not a gate. Cheap enough to run twice.
      - name: Version, tag and CHANGELOG agree
        run: bash scripts/tests/version-sync.test.sh

      - name: Production ZK provenance gate
        run: sh scripts/verify-production-rejects-dev-fixtures.sh

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@3fc1e40d4c4ce3007de028907c886bc3996ce2ea # 1.96.0

      # Three SBOMs because there are three dependency graphs, and a release
      # that names only the Rust one is not an inventory of what shipped.
      # SBOMs are part of the release contract, so a failure to produce one
      # fails the release.
      #
      # Each of these ended with `|| echo "::warning::… SBOM failed"`, so a
      # release could be published having merely ATTEMPTED its dependency
      # inventory. An inventory that might not exist is not an inventory, and
      # the warning was in a log nobody reads after a green run. Same defect
      # class as the beacon check that discarded its result.
      #
      # The generators are version-pinned for the same reason the ZK artifacts
      # are: an inventory produced by an unknown tool version is not
      # reproducible, and reproducibility is most of what it is for.
      - name: Generate SBOMs
        run: bash scripts/generate-release-sboms.sh

      - name: Stage ZK provenance
        run: |
          mkdir -p provenance
          set -euo pipefail
          cp zk/artifacts/ceremony/transcript.json provenance/
          for m in zk/artifacts/*/manifest.json; do
            [ -e "$m" ] || continue
            cp "$m" "provenance/$(basename "$(dirname "$m")").manifest.json"
          done
          ls -la provenance

      - name: Verify signatures and assemble canonical release assets
        env:
          TAURI_SIGNING_PUBLIC_KEY: ${{ secrets.TAURI_SIGNING_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          version=$(node -p "JSON.parse(require('fs').readFileSync('crates/annex-desktop/tauri.conf.json', 'utf8')).version")
          tag="${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('dry-run-{0}', github.sha) }}"
          node scripts/stage-desktop-release.mjs --artifacts artifacts --output release-assets \
            --version "$version" --tag "$tag" --repository "${{ github.repository }}" \
            --commit "${{ github.sha }}" --unsigned-dry-run "${ANNEX_UNSIGNED_DRY_RUN}" --provenance provenance

      # The release body used to be `generate_release_notes: true` alone — a
      # list of commit subjects — while the hand-written `## [x.y.z]` section of
      # CHANGELOG.md went unused. The changelog is where the reasoning is; a
      # commit list is what you read when there isn't one. Generated notes stay
      # on as an appendix.
      #
      # Fails the release when the section is absent, which is the same fact
      # `version-sync.test.sh` asserts, enforced at the point of use.
      - name: Release notes from the CHANGELOG
        run: |
          set -euo pipefail
          version=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          python3 scripts/changelog-section.py CHANGELOG.md "${version}" > RELEASE_NOTES.md
          echo "--- release body ---"
          head -30 RELEASE_NOTES.md

      - name: Refuse changes to an already published release
        env:
          GH_TOKEN: ${{ github.token }}
          ANNEX_RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('dry-run-{0}', github.sha) }}
        run: node scripts/check-release-write-eligibility.mjs

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          overwrite_files: false
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('dry-run-{0}', github.sha) }}
          target_commitish: ${{ github.sha }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('Dry run {0}', github.sha) }}
          # Names, actual signatures, download catalog and final checksums are
          # generated together from the required native outputs above.
          files: release-assets/*
          fail_on_unmatched_files: true
