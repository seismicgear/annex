name: Release Desktop App

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      include_macos:
        description: "Include macOS desktop build (deferred / non-blocking)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      dry_run:
        description: "Prove the pipeline without tagging: builds everything and creates a draft release named dry-run-<sha>"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

env:
  CARGO_TERM_COLOR: always
  # `production` makes scripts/build-desktop.js call zk/scripts/verify-artifacts.js
  # against the pinned manifest. Refusing to skip is the whole point of release.
  ANNEX_BUILD_PROFILE: production

jobs:
  # ── Required platforms: Linux + Windows. A failure here fails the release. ──
  build-linux:
    name: Build (Linux x86_64, required)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.88
        with:
          targets: x86_64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-unknown-linux-gnu

      # Tauri 2 ships against webkit2gtk-4.1, NOT 4.0. The package for the
      # JavaScriptCore bindings has the `lib` prefix on Ubuntu — without it
      # the install fails with "Unable to locate package javascriptcoregtk-4.1-dev".
      # `xdg-desktop-portal` is a runtime portal, not a build-time dep, so we
      # do NOT install it here (and `libxdg-desktop-portal-dev` doesn't exist).
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libpipewire-0.3-dev \
            patchelf

      - name: Verify WebKitGTK version (>= 2.40 required for WebRTC)
        run: |
          version=$(pkg-config --modversion webkit2gtk-4.1)
          echo "WebKitGTK version: $version"
          major=$(echo "$version" | cut -d. -f1)
          minor=$(echo "$version" | cut -d. -f2)
          if [ "$major" -lt 2 ] || { [ "$major" -eq 2 ] && [ "$minor" -lt 40 ]; }; then
            echo "::error::WebKitGTK $version is too old. WebRTC requires >= 2.40."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            zk/package-lock.json

      # Production builds REQUIRE pinned ZK artifacts that match the manifest
      # SHA-256 hashes. We do NOT regenerate keys here — the manifest +
      # tracked-in-git artifacts are the source of truth.
      #
      # `--all` rather than a bare invocation: the bare form defaults to the
      # `membership` manifest alone, and the DEFAULT identity path is
      # membership_v2. Gating one circuit of six let the other five reach a
      # bundle unverified.
      #
      # The dev-fixture bypass env var is deliberately absent from this
      # workflow; scripts/verify-production-rejects-dev-fixtures.sh asserts
      # that it stays absent, and that this step still says `--all`.
      - name: Verify pinned ZK artifacts
        run: node scripts/verify-artifacts.js --all
        working-directory: zk

      # Hashes prove the files have not changed since the ceremony. They do
      # not prove a ceremony happened. `zkey verify` walks r1cs → ptau →
      # every contribution → beacon, and the beacon is checked against the
      # drand round the transcript committed to before that round existed.
      - name: Verify the ZK ceremony
        run: node scripts/verify-ceremony.js
        working-directory: zk

      - name: Install Tauri CLI
        run: cargo install tauri-cli@2.11.2 --locked

      - name: Build Tauri app (Linux)
        working-directory: crates/annex-desktop
        run: cargo tauri build --target x86_64-unknown-linux-gnu
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: annex-linux-x86_64
          path: |
            target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
            target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  build-windows:
    name: Build (Windows x86_64, required)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.88
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-pc-windows-msvc

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            zk/package-lock.json

      - name: Verify Visual Studio C++ workload
        run: |
          & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * `
            -requires Microsoft.VisualStudio.Workload.NativeDesktop `
            -property installationPath
        shell: pwsh

      - name: Verify pinned ZK artifacts
        shell: bash
        run: node scripts/verify-artifacts.js --all
        working-directory: zk

      - name: Verify the ZK ceremony
        shell: bash
        run: node scripts/verify-ceremony.js
        working-directory: zk

      - name: Install Tauri CLI
        run: cargo install tauri-cli@2.11.2 --locked

      - name: Build Tauri app (Windows)
        working-directory: crates/annex-desktop
        run: cargo tauri build --target x86_64-pc-windows-msvc
        env:
          CMAKE_ARGS: -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: annex-windows-x86_64
          path: |
            target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
          if-no-files-found: error

  # ── Deferred platform: macOS. Opt-in via workflow_dispatch only. ──
  # We don't run macOS automatically on tag pushes — the toolchain isn't
  # validated by every PR (see ci.yml). When the user explicitly asks
  # for it (workflow_dispatch with include_macos=true) we run it but
  # `continue-on-error` keeps a Mac-side breakage from blocking the
  # Linux + Windows release.
  build-macos:
    name: Build (macOS, deferred)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.include_macos == 'true' }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch: arm64
          - target: x86_64-apple-darwin
            arch: x86_64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.88
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            zk/package-lock.json

      - name: Verify pinned ZK artifacts
        run: node scripts/verify-artifacts.js --all
        working-directory: zk

      - name: Verify the ZK ceremony
        run: node scripts/verify-ceremony.js
        working-directory: zk

      - name: Install Tauri CLI
        run: cargo install tauri-cli@2.11.2 --locked

      - name: Build Tauri app (macOS)
        working-directory: crates/annex-desktop
        run: cargo tauri build --target ${{ matrix.target }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: annex-macos-${{ matrix.arch }}
          path: |
            target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: warn

  # The release job depends only on the required platforms. macOS is opt-in
  # and `continue-on-error: true`, so its failure does not block the GitHub
  # Release. If the user dispatched with include_macos=true and the macOS
  # build did produce artifacts, they'll be picked up by download-artifact
  # via the artifacts/** glob below.
  release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    # A tag publishes; a dispatch with dry_run proves the pipeline without one.
    # Before this, the only way to find out whether the release job worked was
    # to push a tag — which is the one action you cannot take back.
    if: >-
      startsWith(github.ref, 'refs/tags/') ||
      (github.event_name == 'workflow_dispatch' && inputs.dry_run == 'true')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f | sort

      # Unsigned artifacts used to be produced silently: the workflow passed
      # `TAURI_SIGNING_PRIVATE_KEY: ""`, Tauri skipped signing, and the release
      # went out with no `.sig` files and nothing saying so. That is defect
      # class 1 — a failure rendered as an ordinary result — applied to the one
      # step whose whole job is proving the bytes are ours.
      #
      # A dry run reports; a tag fails. See docs/RELEASING.md for how to
      # generate the key and where each half goes.
      - name: Check for updater signatures
        run: |
          count=$(find artifacts -name '*.sig' | wc -l)
          echo "Found ${count} signature file(s)."
          if [ "${count}" -eq 0 ]; then
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "::warning::No .sig files. TAURI_SIGNING_PRIVATE_KEY is unset, so these"
              echo "::warning::artifacts are unsigned. Fine for a dry run; not for a tag."
            else
              echo "::error::No .sig files on a tagged release. Set the"
              echo "::error::TAURI_SIGNING_PRIVATE_KEY secret (docs/RELEASING.md) — refusing"
              echo "::error::to publish artifacts nobody can verify."
              exit 1
            fi
          fi

      # Checksums are the verification path while OS code signing is not in
      # place: a user who hits SmartScreen or Gatekeeper can still confirm the
      # download is the one this workflow built.
      - name: Generate SHA256SUMS
        run: |
          cd artifacts
          find . -type f \( -name '*.deb' -o -name '*.AppImage' -o -name '*.exe' \
            -o -name '*.msi' -o -name '*.dmg' -o -name '*.sig' \) \
            -exec sha256sum {} + | sed 's| \./| |' | sort -k2 > ../SHA256SUMS
          cd ..
          cat SHA256SUMS

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.88

      # Three SBOMs because there are three dependency graphs, and a release
      # that names only the Rust one is not an inventory of what shipped.
      - name: Generate SBOMs
        run: |
          cargo install cargo-cyclonedx --locked || true
          cargo cyclonedx --format json --all || echo "::warning::cargo-cyclonedx failed"
          find . -name 'bom.json' -not -path './node_modules/*' -exec cp {} annex-rust.cdx.json \; || true
          npx --yes @cyclonedx/cyclonedx-npm@latest --output-file client.cdx.json \
            --package-lock-only client/package-lock.json || echo "::warning::client SBOM failed"
          npx --yes @cyclonedx/cyclonedx-npm@latest --output-file zk.cdx.json \
            --package-lock-only zk/package-lock.json || echo "::warning::zk SBOM failed"
          ls -la ./*.cdx.json || true

      # The ZK provenance travels with the release, so a verifier does not have
      # to clone the repository to check what the bundled keys descend from.
      - name: Stage ZK provenance
        run: |
          mkdir -p provenance
          cp zk/artifacts/ceremony/transcript.json provenance/ 2>/dev/null || \
            echo "::warning::no ceremony transcript to attach"
          for m in zk/artifacts/*/manifest.json; do
            [ -e "$m" ] || continue
            cp "$m" "provenance/$(basename "$(dirname "$m")").manifest.json"
          done
          ls -la provenance || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('dry-run-{0}', github.sha) }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('Dry run {0}', github.sha) }}
          files: |
            artifacts/**/*.deb
            artifacts/**/*.AppImage
            artifacts/**/*.exe
            artifacts/**/*.msi
            artifacts/**/*.dmg
            artifacts/**/*.sig
            SHA256SUMS
            ./*.cdx.json
            provenance/*
