name: Release Desktop App

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      include_macos:
        description: "Include macOS desktop build (deferred / non-blocking)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      dry_run:
        description: "Prove the pipeline without tagging: builds everything and creates a draft release named dry-run-<sha>"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      unsigned_dry_run:
        description: "Build WITHOUT updater signing keys. The only way to get an unsigned build; refused on a tag."
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

env:
  CARGO_TERM_COLOR: always
  # `production` makes scripts/build-desktop.js call zk/scripts/verify-artifacts.js
  # against the pinned manifest. Refusing to skip is the whole point of release.
  ANNEX_BUILD_PROFILE: production

jobs:
  # ── Required platforms: Linux + Windows. A failure here fails the release. ──
  build-linux:
    name: Build (Linux x86_64, required)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.88
        with:
          targets: x86_64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-unknown-linux-gnu

      # Tauri 2 ships against webkit2gtk-4.1, NOT 4.0. The package for the
      # JavaScriptCore bindings has the `lib` prefix on Ubuntu — without it
      # the install fails with "Unable to locate package javascriptcoregtk-4.1-dev".
      # `xdg-desktop-portal` is a runtime portal, not a build-time dep, so we
      # do NOT install it here (and `libxdg-desktop-portal-dev` doesn't exist).
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libpipewire-0.3-dev \
            patchelf

      - name: Verify WebKitGTK version (>= 2.40 required for WebRTC)
        run: |
          version=$(pkg-config --modversion webkit2gtk-4.1)
          echo "WebKitGTK version: $version"
          major=$(echo "$version" | cut -d. -f1)
          minor=$(echo "$version" | cut -d. -f2)
          if [ "$major" -lt 2 ] || { [ "$major" -eq 2 ] && [ "$minor" -lt 40 ]; }; then
            echo "::error::WebKitGTK $version is too old. WebRTC requires >= 2.40."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            zk/package-lock.json

      # Production builds REQUIRE pinned ZK artifacts that match the manifest
      # SHA-256 hashes. We do NOT regenerate keys here — the manifest +
      # tracked-in-git artifacts are the source of truth.
      #
      # `--all` rather than a bare invocation: the bare form defaults to the
      # `membership` manifest alone, and the DEFAULT identity path is
      # membership_v2. Gating one circuit of six let the other five reach a
      # bundle unverified.
      #
      # The dev-fixture bypass env var is deliberately absent from this
      # workflow; scripts/verify-production-rejects-dev-fixtures.sh asserts
      # that it stays absent, and that this step still says `--all`.
      # `verify-ceremony.js` needs zk/node_modules.
      #
      # It shells out to `zk/node_modules/snarkjs/build/cli.cjs` for
      # `zkey verify`, and requires `@noble/curves` to check the drand beacon's
      # BLS signature. Neither exists on a clean runner. Configuring an npm
      # CACHE — which the Setup Node step above does — does not create the
      # directory; it only makes populating it faster. So the verification step
      # that the release contract rests on could not run at all.
      #
      # `verify-artifacts.js` needs none of this (it only hashes files), which
      # is why the gap survived: the cheap gate passed and the expensive one
      # was never reached.
      - name: Install ZK dependencies
        run: npm ci
        working-directory: zk

      - name: Verify pinned ZK artifacts
        run: node scripts/verify-artifacts.js --all
        working-directory: zk

      # Hashes prove the files have not changed since the ceremony. They do
      # not prove a ceremony happened. `zkey verify` walks r1cs → ptau →
      # every contribution → beacon, and the beacon is checked against the
      # drand round the transcript committed to before that round existed.
      - name: Verify the ZK ceremony
        run: node scripts/verify-ceremony.js
        working-directory: zk

      - name: Install Tauri CLI
        run: cargo install tauri-cli@2.11.2 --locked

      - name: Build Tauri app (Linux)
        working-directory: crates/annex-desktop
        run: |
          set -euo pipefail
          # Updater artifacts exist only when there is a key to sign them with.
          #
          # `createUpdaterArtifacts` is NOT committed in tauri.conf.json and the
          # public key is NOT in the repository. The pubkey is the operator's
          # half of their own signing key; a value baked into the tree would
          # either be a placeholder that produces unverifiable updates, or a key
          # whose private half somebody else holds. It is injected here with
          # `--config`, from a repository secret, so the committed config stays
          # truthful about what it can prove.
          if [ -n "${TAURI_SIGNING_PUBLIC_KEY:-}" ]; then
            echo "Signing key configured — building updater artifacts."
            CONFIG=$(printf '{"bundle":{"createUpdaterArtifacts":true},"plugins":{"updater":{"pubkey":"%s","endpoints":["%s"]}}}' \
              "${TAURI_SIGNING_PUBLIC_KEY}" "${ANNEX_UPDATER_ENDPOINT}")
          else
            echo "No TAURI_SIGNING_PUBLIC_KEY — building WITHOUT updater artifacts."
            echo "The release job refuses this unless unsigned_dry_run was set."
            CONFIG='{}'
          fi
          cargo tauri build --target x86_64-unknown-linux-gnu --config "${CONFIG}"
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_SIGNING_PUBLIC_KEY: ${{ secrets.TAURI_SIGNING_PUBLIC_KEY }}
          ANNEX_UPDATER_ENDPOINT: ${{ vars.ANNEX_UPDATER_ENDPOINT || 'https://github.com/seismicgear/annex/releases/latest/download/latest.json' }}

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: annex-linux-x86_64
          path: |
            target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
            target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
            # The updater bundle and its detached signature. Without these two
            # lines the signatures never left the build job, so the release job
            # below looked for `.sig` files in artifacts that could not contain
            # any — and a correctly-configured signing key would still have
            # produced a release with nothing to verify.
            target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage.tar.gz
            target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage.tar.gz.sig
          if-no-files-found: error

  build-windows:
    name: Build (Windows x86_64, required)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.88
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-pc-windows-msvc

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            zk/package-lock.json

      - name: Verify Visual Studio C++ workload
        run: |
          & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * `
            -requires Microsoft.VisualStudio.Workload.NativeDesktop `
            -property installationPath
        shell: pwsh

      # See the Linux job: verify-ceremony.js needs zk/node_modules, and an
      # npm cache is not the same thing as an install.
      - name: Install ZK dependencies
        shell: bash
        run: npm ci
        working-directory: zk

      - name: Verify pinned ZK artifacts
        shell: bash
        run: node scripts/verify-artifacts.js --all
        working-directory: zk

      - name: Verify the ZK ceremony
        shell: bash
        run: node scripts/verify-ceremony.js
        working-directory: zk

      - name: Install Tauri CLI
        run: cargo install tauri-cli@2.11.2 --locked

      - name: Build Tauri app (Windows)
        working-directory: crates/annex-desktop
        shell: bash
        run: |
          set -euo pipefail
          # See the Linux job for why the pubkey is injected rather than
          # committed.
          if [ -n "${TAURI_SIGNING_PUBLIC_KEY:-}" ]; then
            echo "Signing key configured — building updater artifacts."
            CONFIG=$(printf '{"bundle":{"createUpdaterArtifacts":true},"plugins":{"updater":{"pubkey":"%s","endpoints":["%s"]}}}' \
              "${TAURI_SIGNING_PUBLIC_KEY}" "${ANNEX_UPDATER_ENDPOINT}")
          else
            echo "No TAURI_SIGNING_PUBLIC_KEY — building WITHOUT updater artifacts."
            CONFIG='{}'
          fi
          cargo tauri build --target x86_64-pc-windows-msvc --config "${CONFIG}"
        env:
          CMAKE_ARGS: -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_SIGNING_PUBLIC_KEY: ${{ secrets.TAURI_SIGNING_PUBLIC_KEY }}
          ANNEX_UPDATER_ENDPOINT: ${{ vars.ANNEX_UPDATER_ENDPOINT || 'https://github.com/seismicgear/annex/releases/latest/download/latest.json' }}

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: annex-windows-x86_64
          path: |
            target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
            # Same omission as Linux: the updater bundles and signatures.
            target/x86_64-pc-windows-msvc/release/bundle/nsis/*.nsis.zip
            target/x86_64-pc-windows-msvc/release/bundle/nsis/*.nsis.zip.sig
            target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi.zip
            target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi.zip.sig
          if-no-files-found: error

  # ── Deferred platform: macOS. Opt-in via workflow_dispatch only. ──
  # We don't run macOS automatically on tag pushes — the toolchain isn't
  # validated by every PR (see ci.yml). When the user explicitly asks
  # for it (workflow_dispatch with include_macos=true) we run it but
  # `continue-on-error` keeps a Mac-side breakage from blocking the
  # Linux + Windows release.
  build-macos:
    name: Build (macOS, deferred)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.include_macos == 'true' }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch: arm64
          - target: x86_64-apple-darwin
            arch: x86_64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.88
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            zk/package-lock.json

      # `verify-ceremony.js` needs zk/node_modules.
      #
      # It shells out to `zk/node_modules/snarkjs/build/cli.cjs` for
      # `zkey verify`, and requires `@noble/curves` to check the drand beacon's
      # BLS signature. Neither exists on a clean runner. Configuring an npm
      # CACHE — which the Setup Node step above does — does not create the
      # directory; it only makes populating it faster. So the verification step
      # that the release contract rests on could not run at all.
      #
      # `verify-artifacts.js` needs none of this (it only hashes files), which
      # is why the gap survived: the cheap gate passed and the expensive one
      # was never reached.
      - name: Install ZK dependencies
        run: npm ci
        working-directory: zk

      - name: Verify pinned ZK artifacts
        run: node scripts/verify-artifacts.js --all
        working-directory: zk

      - name: Verify the ZK ceremony
        run: node scripts/verify-ceremony.js
        working-directory: zk

      - name: Install Tauri CLI
        run: cargo install tauri-cli@2.11.2 --locked

      - name: Build Tauri app (macOS)
        working-directory: crates/annex-desktop
        run: |
          set -euo pipefail
          # See the Linux job for why the pubkey is injected rather than
          # committed.
          if [ -n "${TAURI_SIGNING_PUBLIC_KEY:-}" ]; then
            echo "Signing key configured — building updater artifacts."
            CONFIG=$(printf '{"bundle":{"createUpdaterArtifacts":true},"plugins":{"updater":{"pubkey":"%s","endpoints":["%s"]}}}' \
              "${TAURI_SIGNING_PUBLIC_KEY}" "${ANNEX_UPDATER_ENDPOINT}")
          else
            echo "No TAURI_SIGNING_PUBLIC_KEY — building WITHOUT updater artifacts."
            CONFIG='{}'
          fi
          cargo tauri build --target ${{ matrix.target }} --config "${CONFIG}"
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_SIGNING_PUBLIC_KEY: ${{ secrets.TAURI_SIGNING_PUBLIC_KEY }}
          ANNEX_UPDATER_ENDPOINT: ${{ vars.ANNEX_UPDATER_ENDPOINT || 'https://github.com/seismicgear/annex/releases/latest/download/latest.json' }}

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: annex-macos-${{ matrix.arch }}
          path: |
            target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz
            target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz.sig
            target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: warn

  # The release job depends only on the required platforms. macOS is opt-in
  # and `continue-on-error: true`, so its failure does not block the GitHub
  # Release. If the user dispatched with include_macos=true and the macOS
  # build did produce artifacts, they'll be picked up by download-artifact
  # via the artifacts/** glob below.
  release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    # A tag publishes; a dispatch with dry_run proves the pipeline without one.
    # Before this, the only way to find out whether the release job worked was
    # to push a tag — which is the one action you cannot take back.
    if: >-
      startsWith(github.ref, 'refs/tags/') ||
      (github.event_name == 'workflow_dispatch' && inputs.dry_run == 'true')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f | sort

      # Unsigned artifacts used to be produced silently: the workflow passed
      # `TAURI_SIGNING_PRIVATE_KEY: ""`, Tauri skipped signing, and the release
      # went out with no `.sig` files and nothing saying so. That is defect
      # class 1 — a failure rendered as an ordinary result — applied to the one
      # step whose whole job is proving the bytes are ours.
      #
      # A dry run reports; a tag fails. See docs/RELEASING.md for how to
      # generate the key and where each half goes.
      # Every updater bundle must carry its OWN signature.
      #
      # This counted `.sig` files and passed if the count was non-zero, which
      # answers a different question than the one that matters: one signed
      # Linux bundle would have satisfied it for a release whose Windows
      # bundles were entirely unsigned. Pair them up instead.
      #
      # And the dry run enforced LESS than the tag — a missing signature was a
      # warning on `workflow_dispatch` and an error on a tag. So a green dry
      # run established nothing about whether the tagged-release contract
      # worked, which is the one thing a dry run exists to establish. Both
      # paths now run the same check. `unsigned_dry_run` is the single,
      # explicit way to get an unsigned build, and it is refused on a tag.
      - name: Verify updater signatures
        run: |
          set -euo pipefail

          unsigned_ok="${{ github.event_name == 'workflow_dispatch' && inputs.unsigned_dry_run || 'false' }}"
          is_tag="${{ startsWith(github.ref, 'refs/tags/') }}"

          if [ "${is_tag}" = "true" ] && [ "${unsigned_ok}" = "true" ]; then
            echo "::error::unsigned_dry_run cannot be used on a tagged release."
            exit 1
          fi

          # The bundles the updater actually consumes. The .deb/.exe/.msi a
          # user downloads by hand are NOT signed by Tauri — conflating the two
          # is how "every artifact needs a .sig" becomes an unsatisfiable rule.
          mapfile -t bundles < <(find artifacts \
            \( -name '*.AppImage.tar.gz' -o -name '*.nsis.zip' -o -name '*.msi.zip' \
               -o -name '*.app.tar.gz' \) -print | sort)

          echo "Found ${#bundles[@]} updater bundle(s)."
          missing=0
          for b in "${bundles[@]}"; do
            if [ -f "${b}.sig" ]; then
              echo "  signed   $(basename "${b}")"
            else
              echo "::error::unsigned $(basename "${b}") — no ${b}.sig"
              missing=$((missing + 1))
            fi
          done

          if [ "${#bundles[@]}" -eq 0 ]; then
            if [ "${unsigned_ok}" = "true" ]; then
              echo "::warning::No updater bundles. createUpdaterArtifacts is off because"
              echo "::warning::no signing key was supplied, and unsigned_dry_run was set."
              exit 0
            fi
            echo "::error::No updater bundles were produced. Set TAURI_SIGNING_PRIVATE_KEY"
            echo "::error::and TAURI_SIGNING_PUBLIC_KEY (docs/RELEASING.md), or re-run a"
            echo "::error::workflow_dispatch with unsigned_dry_run=true to build without them."
            exit 1
          fi

          if [ "${missing}" -gt 0 ]; then
            echo "::error::${missing} updater bundle(s) have no signature. Refusing to publish"
            echo "::error::artifacts the updater cannot verify."
            exit 1
          fi

      # Checksums are the verification path while OS code signing is not in
      # place: a user who hits SmartScreen or Gatekeeper can still confirm the
      # download is the one this workflow built.
      - name: Generate SHA256SUMS
        run: |
          cd artifacts
          find . -type f \( -name '*.deb' -o -name '*.AppImage' -o -name '*.exe' \
            -o -name '*.msi' -o -name '*.dmg' -o -name '*.sig' \) \
            -exec sha256sum {} + | sed 's| \./| |' | sort -k2 > ../SHA256SUMS
          cd ..
          cat SHA256SUMS

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.88

      # Three SBOMs because there are three dependency graphs, and a release
      # that names only the Rust one is not an inventory of what shipped.
      # SBOMs are part of the release contract, so a failure to produce one
      # fails the release.
      #
      # Each of these ended with `|| echo "::warning::… SBOM failed"`, so a
      # release could be published having merely ATTEMPTED its dependency
      # inventory. An inventory that might not exist is not an inventory, and
      # the warning was in a log nobody reads after a green run. Same defect
      # class as the beacon check that discarded its result.
      #
      # The generators are version-pinned for the same reason the ZK artifacts
      # are: an inventory produced by an unknown tool version is not
      # reproducible, and reproducibility is most of what it is for.
      - name: Generate SBOMs
        run: |
          set -euo pipefail
          mkdir -p artifacts/sbom

          cargo install cargo-cyclonedx@0.5.7 --locked
          cargo cyclonedx --format json --all
          find . -name 'bom.json' -not -path './artifacts/*' -exec \
            cp {} artifacts/sbom/rust-workspace.json \;

          npx --yes @cyclonedx/cyclonedx-npm@1.19.3 \
            --output-file artifacts/sbom/client.json \
            --package-lock-only client/package-lock.json
          npx --yes @cyclonedx/cyclonedx-npm@1.19.3 \
            --output-file artifacts/sbom/zk.json \
            --package-lock-only zk/package-lock.json

          # Produced is not the same as complete. An empty components array is
          # what a misconfigured generator emits, and it would otherwise ship
          # looking exactly like a real inventory.
          for f in artifacts/sbom/rust-workspace.json artifacts/sbom/client.json artifacts/sbom/zk.json; do
            if [ ! -s "$f" ]; then
              echo "::error::${f} was not produced."
              exit 1
            fi
            count=$(python3 -c "import json,sys; print(len(json.load(open(sys.argv[1])).get('components',[])))" "$f")
            echo "${f}: ${count} component(s)"
            if [ "${count}" -lt 1 ]; then
              echo "::error::${f} lists no components — the inventory is empty, not clean."
              exit 1
            fi
          done

      # The update manifest the plugin polls.
      #
      # `plugins.updater.endpoints` points at `latest.json`, and nothing
      # generated one — so a correctly signed, correctly uploaded set of
      # updater bundles would still have produced an app that checked for
      # updates, got a 404, and reported no update available. Signed artifacts
      # nobody can discover are the same as no artifacts.
      #
      # Built from the .sig files themselves rather than from a template: the
      # signature content IS the field the plugin verifies, so deriving the
      # manifest from the signatures makes the two impossible to disagree.
      - name: Generate update manifest
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.unsigned_dry_run == 'true') }}
        run: |
          set -euo pipefail
          version="${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('0.0.0-dryrun-{0}', github.sha) }}"
          version="${version#v}"
          base="${{ github.server_url }}/${{ github.repository }}/releases/download/${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('dry-run-{0}', github.sha) }}"

          python3 - "$version" "$base" <<'PYEOF'
          import json, pathlib, sys

          version, base = sys.argv[1], sys.argv[2]
          # Tauri's platform keys. Only the ones we actually built appear.
          patterns = {
              "linux-x86_64": "*.AppImage.tar.gz",
              "windows-x86_64": "*.nsis.zip",
              "darwin-x86_64": "*.app.tar.gz",
              "darwin-aarch64": "*.app.tar.gz",
          }
          arts = pathlib.Path("artifacts")
          platforms = {}
          for key, pat in patterns.items():
              want_arch = key.split("-", 1)[1]
              for bundle in sorted(arts.rglob(pat)):
                  # macOS ships per-arch directories; match on the artifact
                  # folder name so x86_64 and aarch64 do not overwrite each other.
                  if key.startswith("darwin") and want_arch not in str(bundle):
                      continue
                  sig = bundle.with_suffix(bundle.suffix + ".sig")
                  if not sig.exists():
                      continue
                  platforms[key] = {
                      "signature": sig.read_text().strip(),
                      "url": f"{base}/{bundle.name}",
                  }
                  break

          if not platforms:
              raise SystemExit("no signed updater bundles found; refusing to write an empty manifest")

          manifest = {
              "version": version,
              "notes": f"Annex {version}",
              "pub_date": __import__("datetime").datetime.now(
                  __import__("datetime").timezone.utc
              ).isoformat().replace("+00:00", "Z"),
              "platforms": platforms,
          }
          out = arts / "latest.json"
          out.write_text(json.dumps(manifest, indent=2) + "\n")
          print(f"wrote {out} for {sorted(platforms)}")
          PYEOF

      - name: Stage ZK provenance
        run: |
          mkdir -p provenance
          cp zk/artifacts/ceremony/transcript.json provenance/ 2>/dev/null || \
            echo "::warning::no ceremony transcript to attach"
          for m in zk/artifacts/*/manifest.json; do
            [ -e "$m" ] || continue
            cp "$m" "provenance/$(basename "$(dirname "$m")").manifest.json"
          done
          ls -la provenance || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('dry-run-{0}', github.sha) }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('Dry run {0}', github.sha) }}
          files: |
            artifacts/**/*.deb
            artifacts/**/*.AppImage
            artifacts/**/*.exe
            artifacts/**/*.msi
            artifacts/**/*.dmg
