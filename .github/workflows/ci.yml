name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      include_macos:
        description: "Include macOS desktop build (deferred / non-blocking)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

env:
  CARGO_TERM_COLOR: always

jobs:
  # Fast server checks — no WebKitGTK needed, matches what Claude Code runs locally
  check-server:
    name: Check (Server)
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: Setup Node.js (for ZK key generation)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: zk/package-lock.json

      - name: Generate ZK keys
        run: |
          cd zk && npm ci
          node scripts/build-circuits.js
          node scripts/setup-groth16.js

      # Tests the production-profile dev-fixture gate in verify-artifacts.js.
      # Cheap (~1s) and the regression class — release silently shipping
      # dev keys — is too painful to leave ungated.
      - name: ZK script tests
        run: npm test
        working-directory: zk

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --exclude annex-desktop --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace --exclude annex-desktop

  # Linux desktop build — REQUIRED for release. Validates the full Tauri pipeline:
  # build-desktop.js runs, ZK artifacts must verify, frontend builds, Rust links
  # against system WebKitGTK.
  check-desktop-linux:
    name: Build Desktop (Linux, required)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-desktop

      # WebRTC needs WebKitGTK >= 2.40. Tauri 2 uses webkit2gtk-4.1 (NOT 4.0).
      # The Ubuntu package for libjavascriptcoregtk has the `lib` prefix —
      # `javascriptcoregtk-4.1-dev` is NOT a real package and apt will fail.
      - name: Install Linux dependencies (WebKitGTK 4.1, GTK3, PipeWire)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libpipewire-0.3-dev \
            patchelf

      - name: Verify WebKitGTK version (>= 2.40 required for WebRTC)
        run: |
          version=$(pkg-config --modversion webkit2gtk-4.1)
          echo "WebKitGTK version: $version"
          major=$(echo "$version" | cut -d. -f1)
          minor=$(echo "$version" | cut -d. -f2)
          if [ "$major" -lt 2 ] || { [ "$major" -eq 2 ] && [ "$minor" -lt 40 ]; }; then
            echo "::error::WebKitGTK $version is too old. WebRTC requires >= 2.40."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            client/package-lock.json
            zk/package-lock.json

      - name: Install client dependencies
        run: npm ci
        working-directory: client

      # Real ZK keys, real circuits — no `|| true` and no `{}` fallback.
      # Production profile would also enforce the manifest; here we accept
      # dev-fixture entropy because PRs don't ship a ceremony.
      - name: Generate ZK keys (dev-fixture entropy)
        run: |
          npm ci
          node scripts/build-circuits.js
          node scripts/setup-groth16.js
        working-directory: zk

      # First-class lightweight gates. `cargo check` + `cargo clippy`
      # on annex-desktop are the fast Rust-only validations: they don't
      # need Piper, the frontend, or the bundler — only the system libs
      # installed above + the gitignored `assets/piper/` and
      # `assets/voices/` directories (the `.gitkeep` stubs ship those).
      # Putting them BEFORE the heavy `cargo tauri build` step means a
      # Rust regression fails CI in under a minute rather than after a
      # full bundle attempt.
      - name: Ensure asset stub dirs exist
        run: mkdir -p assets/piper assets/voices

      - name: cargo check (annex-desktop)
        run: cargo check -p annex-desktop

      - name: cargo clippy (annex-desktop)
        run: cargo clippy -p annex-desktop --all-targets -- -D warnings

      # `cargo tauri build` runs build-desktop.js as beforeBuildCommand,
      # which copies client/public/zk/* into the frontend dist and Tauri
      # then bundles membership_vkey.json + assets/ as resources.
      #
      # `cargo test -p annex-desktop` is intentionally NOT run on PR CI:
      # the test build links every Linux Tauri dep (gtk, wry, webkit2gtk)
      # twice (lib + test binary), which on the standard GitHub runner
      # consumes >30 GiB of disk and routinely fails with
      # `final link failed: No space left on device`. The release
      # workflow (`release-desktop.yml`) runs the full Tauri build for
      # the bundle stage, which is the strongest signal we have for
      # desktop correctness.
      - name: Install Tauri CLI
        run: cargo install tauri-cli@2 --locked

      - name: Tauri build (debug — validates bundle wiring)
        working-directory: crates/annex-desktop
        # We run the debug build (faster cache reuse) but execute the full
        # beforeBuildCommand. SKIP_PIPER avoids hitting GitHub from CI on
        # every PR — the production release workflow downloads piper.
        run: SKIP_PIPER=1 cargo tauri build --debug --bundles deb,appimage
        env:
          ANNEX_BUILD_PROFILE: dev

  # Windows desktop build — REQUIRED for release. Validates MSVC / WebView2 link.
  check-desktop-windows:
    name: Build Desktop (Windows, required)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-desktop

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            client/package-lock.json
            zk/package-lock.json

      - name: Verify Visual Studio C++ workload
        run: |
          "$env:ProgramFiles(x86)\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * `
            -requires Microsoft.VisualStudio.Workload.NativeDesktop `
            -property installationPath
        shell: pwsh

      # No `|| true` and no `{}` fallback — if ZK setup fails on Windows we
      # want CI red. The runners ship modern Node/Git, so circom + snarkjs
      # work without extra setup.
      - name: Generate ZK keys (dev-fixture entropy)
        shell: bash
        run: |
          npm ci
          node scripts/build-circuits.js
          node scripts/setup-groth16.js
        working-directory: zk

      - name: Install client dependencies
        run: npm ci
        working-directory: client

      - name: Install Tauri CLI
        run: cargo install tauri-cli@2 --locked

      # Skip piper on PR builds (avoids reaching out to release CDN every PR).
      # The release-desktop workflow runs the full pipeline including piper.
      - name: Tauri build (debug — validates bundle wiring)
        working-directory: crates/annex-desktop
        shell: bash
        run: SKIP_PIPER=1 cargo tauri build --debug --bundles nsis
        env:
          ANNEX_BUILD_PROFILE: dev
          CMAKE_ARGS: -DCMAKE_POLICY_VERSION_MINIMUM=3.5

  # macOS desktop build — DEFERRED / non-blocking. Only runs when manually
  # dispatched with include_macos=true. Removing this from PR/main is intentional:
  # we don't claim macOS works on every commit, and Apple-side toolchain churn
  # shouldn't block Windows/Linux releases.
  check-desktop-macos:
    name: Build Desktop (macOS, deferred)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.include_macos == 'true' }}
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-desktop

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            client/package-lock.json
            zk/package-lock.json

      - name: Generate ZK keys (dev-fixture entropy)
        run: |
          npm ci
          node scripts/build-circuits.js
          node scripts/setup-groth16.js
        working-directory: zk

      - name: Install client dependencies
        run: npm ci
        working-directory: client

      - name: Install Tauri CLI
        run: cargo install tauri-cli@2 --locked

      - name: Tauri build (debug)
        working-directory: crates/annex-desktop
        run: SKIP_PIPER=1 cargo tauri build --debug --bundles app
        env:
          ANNEX_BUILD_PROFILE: dev

  # Frontend tests
  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - run: npm ci
      - run: npm test
      - run: npm run lint

  # Server smoke — boots annex-server with enforce_zk_proofs=true and
  # drives the full register → Merkle path → Groth16 proof →
  # verify-membership → authenticated channel-create flow against it.
  # Linux runner only because of the system libraries needed for the
  # release build profile; the Windows variant lives in
  # release-desktop.yml's pre-flight gates.
  smoke-server-linux:
    name: Smoke (Server, Linux)
    runs-on: ubuntu-latest
    needs: check-server
    env:
      ANNEX_SMOKE_PORT: 7321
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
        with:
          key: smoke-server-linux

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: zk/package-lock.json

      - name: Install ZK deps + generate keys (real, no `|| true` fallback)
        run: |
          npm ci
          node scripts/build-circuits.js
          node scripts/setup-groth16.js
        working-directory: zk

      - name: Run server smoke
        run: bash scripts/smoke-server.sh

  # Server smoke — Windows. Same flow as the Linux smoke, exercised on
  # PowerShell so the .ps1 doesn't regress.
  smoke-server-windows:
    name: Smoke (Server, Windows)
    runs-on: windows-latest
    needs: check-server
    env:
      ANNEX_SMOKE_PORT: 7321
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
        with:
          key: smoke-server-windows

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: zk/package-lock.json

      - name: Install ZK deps + generate keys (real, no `|| true` fallback)
        shell: bash
        run: |
          npm ci
          node scripts/build-circuits.js
          node scripts/setup-groth16.js
        working-directory: zk

      - name: Run server smoke
        shell: pwsh
        run: pwsh ./scripts/smoke-server.ps1
