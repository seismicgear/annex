name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Fast server checks — no WebKitGTK needed, matches what Claude Code runs locally
  check-server:
    name: Check (Server)
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: Setup Node.js (for ZK key generation)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: zk/package-lock.json

      - name: Generate ZK keys
        run: |
          cd zk && npm ci
          node scripts/build-circuits.js
          node scripts/setup-groth16.js

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --exclude annex-desktop --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace --exclude annex-desktop

  # Desktop build check — requires WebKitGTK and system dependencies
  check-desktop:
    name: Check (Desktop)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: Install Linux dependencies (WebKitGTK, PipeWire, GTK)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libsoup-3.0-dev \
            javascriptcoregtk-4.1-dev \
            libpipewire-0.3-dev

      - name: Verify WebKitGTK version (>= 2.40 required for WebRTC)
        run: |
          version=$(pkg-config --modversion webkit2gtk-4.1)
          echo "WebKitGTK version: $version"
          major=$(echo "$version" | cut -d. -f1)
          minor=$(echo "$version" | cut -d. -f2)
          if [ "$major" -lt 2 ] || { [ "$major" -eq 2 ] && [ "$minor" -lt 40 ]; }; then
            echo "::error::WebKitGTK $version is too old. WebRTC requires >= 2.40."
            exit 1
          fi

      - name: Setup Node.js (for ZK key generation)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: zk/package-lock.json

      - name: Generate ZK keys and prepare assets
        run: |
          (cd zk && npm ci && node scripts/build-circuits.js && node scripts/setup-groth16.js)
          mkdir -p zk/keys assets/piper assets/voices crates/annex-desktop/dist
          test -f zk/keys/membership_vkey.json || echo '{}' > zk/keys/membership_vkey.json
          echo '<!DOCTYPE html><html><body></body></html>' > crates/annex-desktop/dist/index.html

      - name: cargo build (release)
        run: cargo build --release

  # Frontend tests
  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - run: npm ci
      - run: npm test
      - run: npm run lint

  build-windows:
    name: Build (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows

      - name: Setup Node.js (for ZK key generation)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: zk/package-lock.json

      - name: Verify Visual Studio C++ workload
        run: |
          "$env:ProgramFiles(x86)\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * `
            -requires Microsoft.VisualStudio.Workload.NativeDesktop `
            -property installationPath
        shell: pwsh

      - name: Generate ZK keys and prepare assets
        run: |
          (cd zk && npm ci && node scripts/build-circuits.js && node scripts/setup-groth16.js) || true
          mkdir -p zk/keys assets/piper assets/voices crates/annex-desktop/dist
          test -f zk/keys/membership_vkey.json || echo '{}' > zk/keys/membership_vkey.json
          echo '<!DOCTYPE html><html><body></body></html>' > crates/annex-desktop/dist/index.html
        shell: bash

      - name: cargo build (release)
        run: cargo build -p annex-desktop --release
        env:
          CMAKE_ARGS: -DCMAKE_POLICY_VERSION_MINIMUM=3.5

  build-macos:
    name: Build (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos

      - name: Setup Node.js (for ZK key generation)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: zk/package-lock.json

      - name: Generate ZK keys and prepare assets
        run: |
          (cd zk && npm ci && node scripts/build-circuits.js && node scripts/setup-groth16.js) || true
          mkdir -p zk/keys assets/piper assets/voices crates/annex-desktop/dist
          test -f zk/keys/membership_vkey.json || echo '{}' > zk/keys/membership_vkey.json
          echo '<!DOCTYPE html><html><body></body></html>' > crates/annex-desktop/dist/index.html

      - name: cargo build (release)
        run: cargo build -p annex-desktop --release
