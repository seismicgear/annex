name: CI

on:
  push:
    branches: [main]
  # Every pull request, not only those targeting main.
  #
  # With `branches: [main]` a PR opened against any other base — a stacked
  # branch, a release train, a long-lived feature line — got **zero** checks,
  # and GitHub renders that identically to a PR whose checks all passed. The
  # verification lanes in this file only protect what they actually run on, so
  # restricting them by base branch quietly exempted the PRs most likely to
  # need them.
  pull_request:
  workflow_dispatch:
    inputs:
      include_macos:
        description: "Include macOS desktop build (deferred / non-blocking)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

env:
  CARGO_TERM_COLOR: always

jobs:
  # Fast server checks — no WebKitGTK needed, matches what Claude Code runs locally
  check-server:
    name: Check (Server)
    runs-on: ubuntu-latest
    services:
      admission-store:
        image: redis:7.0.15
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v4
      - name: Install native speech codec build tools
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential libclang-dev
      - uses: dtolnay/rust-toolchain@3fc1e40d4c4ce3007de028907c886bc3996ce2ea # 1.96.0
        with:
          components: clippy, rustfmt
      - name: Verify native codec build tools
        run: cmake --version

      - name: Install Linux DSP binding compiler
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libclang-dev

      - name: Verify native DSP binding compiler
        run: node scripts/verify-libclang.mjs

      - uses: Swatinem/rust-cache@v2

      - name: Setup Node.js (for ZK key generation)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: zk/package-lock.json

      - name: Verify and install pinned ZK artifacts
        run: |
          cd zk && npm ci
          node scripts/verify-artifacts.js --all --profile production
          node scripts/install-ceremony.js

      # Certificate ownership is independently checked against the shipped
      # verifier. Install the matching pinned prover before synchronising the
      # browser artifacts; random CI rekeying must not change that trust anchor.
      - name: Synchronise client ZK artifacts
        run: node scripts/prepare-zk-dev.js

      # The VRP alignment model: 7.5 MB, digest-pinned, fetched from
      # huggingface.co.
      #
      # Not optional for this job. A production-profile server REFUSES to start
      # without it (`StartupError::UnusableAlignmentModel`), because the score
      # it produces decides which peers and agents are trusted and the lexicon
      # fallback is a different instrument whose verdicts a peer running the
      # pinned model cannot reproduce. Several tests start such a server.
      #
      # It also un-skips the two calibration suites. `alignment_calibration.rs`
      # and `wordpiece_vectors.rs` both SKIP when the model is absent, so
      # without this step they pass while measuring nothing — the shape
      # CLAUDE.md calls a test that stops testing what it claims.
      - name: Fetch VRP alignment model
        run: bash scripts/setup-embedding-model.sh

      # Tests the production-profile dev-fixture gate in verify-artifacts.js.
      # Cheap (~1s) and the regression class — release silently shipping
      # dev keys — is too painful to leave ungated.
      - name: ZK script tests
        run: npm test
        working-directory: zk

      # `zk-proof` is a named gate in docs/refactor/release-gates.md and ran
      # in no workflow. The step above covers verify-artifacts.js only; this
      # is the one that generates and verifies real proofs, including the
      # tamper rejections the gate is described by.
      - name: ZK proof round-trip
        run: node scripts/test-proofs.js
        working-directory: zk

      # `zk-production-gate`, the other named gate that ran nowhere. The
      # globbed "Harness script tests" step below matches
      # scripts/tests/*.test.sh; this script is in scripts/ and is not named
      # *.test.sh, so it matched nothing. It asserts that this step exists.
      - name: Production ZK provenance gate
        run: sh scripts/verify-production-rejects-dev-fixtures.sh

      # 41 tests over api/signal.js — the federation signaling relay, and the
      # canonical signing string that crates/annex-federation/src/signal.rs
      # has to match byte for byte. Named by no workflow until now, which is
      # how the two implementations came to disagree about whether
      # `rendezvous_tag` is part of that string.
      - name: Signaling relay tests
        run: node --test api/signal.test.mjs

      # The scripts everything else runs through. Their failures were the
      # silent kind: e2e-server.sh reported "Server ready" about a server it
      # had not started, and claude-setup.sh ended on a failed apt-get with
      # no statement of what failed. Seconds each.
      - name: Harness script tests
        run: |
          for t in scripts/tests/*.test.sh; do
            echo "== $t"
            bash "$t" || exit 1
          done

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --exclude annex-desktop --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace --exclude annex-desktop

      - name: Actual shared admission across independent HTTP processes
        env:
          ANNEX_TEST_REDIS_URL: redis://127.0.0.1:6379/0
        run: cargo test -p annex-server --test shared_rate_limit_live actual_redis -- --ignored --nocapture

  # Linux desktop build — REQUIRED for release. Validates the full Tauri pipeline:
  # build-desktop.js runs, ZK artifacts must verify, frontend builds, Rust links
  # against system WebKitGTK.
  check-desktop-linux:
    name: Build Desktop (Linux, required)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@3fc1e40d4c4ce3007de028907c886bc3996ce2ea # 1.96.0
        with:
          components: clippy, rustfmt
      - name: Verify native codec build tools
        run: cmake --version

      - name: Install Linux DSP binding compiler
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libclang-dev

      - name: Verify native DSP binding compiler
        run: node scripts/verify-libclang.mjs

      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-desktop

      # WebRTC needs WebKitGTK >= 2.40. Tauri 2 uses webkit2gtk-4.1 (NOT 4.0).
      # The Ubuntu package for libjavascriptcoregtk has the `lib` prefix —
      # `javascriptcoregtk-4.1-dev` is NOT a real package and apt will fail.
      - name: Install Linux dependencies (WebKitGTK 4.1, GTK3, PipeWire)
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libclang-dev \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libpipewire-0.3-dev \
            patchelf

      - name: Verify WebKitGTK version (>= 2.40 required for WebRTC)
        run: |
          version=$(pkg-config --modversion webkit2gtk-4.1)
          echo "WebKitGTK version: $version"
          major=$(echo "$version" | cut -d. -f1)
          minor=$(echo "$version" | cut -d. -f2)
          if [ "$major" -lt 2 ] || { [ "$major" -eq 2 ] && [ "$minor" -lt 40 ]; }; then
            echo "::error::WebKitGTK $version is too old. WebRTC requires >= 2.40."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            client/package-lock.json
            zk/package-lock.json

      - name: Install client dependencies
        run: npm ci
        working-directory: client

      # Actual pinned prover and verifier used by certified device ownership.
      - name: Verify and install pinned ZK artifacts
        run: |
          npm ci
          node scripts/verify-artifacts.js --all --profile production
          node scripts/install-ceremony.js
        working-directory: zk

      # First-class lightweight gates. `cargo check` + `cargo clippy`
      # on annex-desktop are the fast Rust-only validations: they don't
      # need Piper, the frontend, or the bundler — only the system libs
      # installed above + the gitignored `assets/piper/` and
      # `assets/voices/` directories (the `.gitkeep` stubs ship those).
      # Putting them BEFORE the heavy `cargo tauri build` step means a
      # Rust regression fails CI in under a minute rather than after a
      # full bundle attempt.
      - name: Prepare pinned native desktop resources
        run: node scripts/prepare-desktop-assets.mjs

      - name: Ensure asset stub dirs exist
        run: mkdir -p assets/piper assets/voices assets/embedding

      # `tauri.conf.json` declares `assets/embedding` in `bundle.resources`, and
      # the bundler validates every declared path at build time. The directory
      # above satisfies that; fetching the real model additionally proves the
      # bundle can carry it, which is what a desktop install depends on for
      # anything but the lexicon fallback.
      - name: Fetch VRP alignment model
        run: bash scripts/setup-embedding-model.sh

      - name: cargo check (annex-desktop)
        run: cargo check -p annex-desktop

      - name: cargo clippy (annex-desktop)
        run: cargo clippy -p annex-desktop --all-targets -- -D warnings

      # `cargo tauri build` runs build-desktop.js as beforeBuildCommand,
      # which copies client/public/zk/* into the frontend dist and Tauri
      # then bundles membership_vkey.json + assets/ as resources.
      #
      # `cargo test -p annex-desktop` is intentionally NOT run on PR CI:
      # the test build links every Linux Tauri dep (gtk, wry, webkit2gtk)
      # twice (lib + test binary), which on the standard GitHub runner
      # consumes >30 GiB of disk and routinely fails with
      # `final link failed: No space left on device`. The release
      # workflow (`release-desktop.yml`) runs the full Tauri build for
      # the bundle stage, which is the strongest signal we have for
      # desktop correctness.
      - name: Install Tauri CLI
        run: cargo install tauri-cli@2.11.2 --locked

      - name: Tauri build (debug — validates bundle wiring)
        working-directory: crates/annex-desktop
        # We run the debug build (faster cache reuse) but execute the full
        # beforeBuildCommand. SKIP_PIPER avoids hitting GitHub from CI on
        # every PR — the production release workflow downloads piper.
        run: cargo tauri build --verbose --debug --bundles deb,appimage
        env:
          ANNEX_BUILD_PROFILE: dev
          # Match release packaging: linuxdeploy's old strip cannot preserve
          # modern ELF RELR sections in the bundled WebKitGTK dependencies.
          NO_STRIP: "true"
          # linuxdeploy scans every bundled ELF, including eSpeak; resolve the
          # shared libraries from the same pinned Piper archive.
          LD_LIBRARY_PATH: ${{ github.workspace }}/assets/piper

  # Windows desktop build — REQUIRED for release. Validates MSVC / WebView2 link.
  check-desktop-windows:
    name: Build Desktop (Windows, required)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@3fc1e40d4c4ce3007de028907c886bc3996ce2ea # 1.96.0
      - name: Verify native codec build tools
        run: cmake --version

      - name: Install Linux DSP binding compiler
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libclang-dev

      - name: Verify native DSP binding compiler
        run: node scripts/verify-libclang.mjs

      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-desktop

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            client/package-lock.json
            zk/package-lock.json

      - name: Verify Visual Studio C++ workload
        run: |
          & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * `
            -requires Microsoft.VisualStudio.Workload.NativeDesktop `
            -property installationPath
        shell: pwsh

      # A missing or mismatched pinned prover must fail the Windows build.
      - name: Verify and install pinned ZK artifacts
        shell: bash
        run: |
          npm ci
          node scripts/verify-artifacts.js --all --profile production
          node scripts/install-ceremony.js
        working-directory: zk

      - name: Install client dependencies
        run: npm ci
        working-directory: client

      - name: Prepare pinned native desktop resources
        shell: pwsh
        run: ./scripts/prepare-desktop-assets.ps1 -WorkDir (Join-Path $env:RUNNER_TEMP 'annex-desktop-assets')

      - name: Install Tauri CLI
        run: cargo install tauri-cli@2.11.2 --locked

      # Skip piper on PR builds (avoids reaching out to release CDN every PR).
      # The release-desktop workflow runs the full pipeline including piper.
      - name: Tauri build (debug — validates bundle wiring)
        working-directory: crates/annex-desktop
        shell: bash
        run: cargo tauri build --debug --bundles nsis
        env:
          ANNEX_BUILD_PROFILE: dev
          CMAKE_ARGS: -DCMAKE_POLICY_VERSION_MINIMUM=3.5

      - name: Verify Windows native runtime closure
        run: node scripts/windows-runtime.mjs --directory target/debug

  # macOS desktop build — DEFERRED / non-blocking. Only runs when manually
  # dispatched with include_macos=true. Removing this from PR/main is intentional:
  # we don't claim macOS works on every commit, and Apple-side toolchain churn
  # shouldn't block Windows/Linux releases.
  check-desktop-macos:
    name: Build Desktop (macOS, deferred)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.include_macos == 'true' }}
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@3fc1e40d4c4ce3007de028907c886bc3996ce2ea # 1.96.0
      - name: Verify native codec build tools
        run: cmake --version

      - name: Install Linux DSP binding compiler
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libclang-dev

      - name: Verify native DSP binding compiler
        run: node scripts/verify-libclang.mjs

      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-desktop

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            client/package-lock.json
            zk/package-lock.json

      - name: Verify and install pinned ZK artifacts
        run: |
          npm ci
          node scripts/verify-artifacts.js --all --profile production
          node scripts/install-ceremony.js
        working-directory: zk

      - name: Install client dependencies
        run: npm ci
        working-directory: client

      - name: Prepare pinned native desktop resources
        run: node scripts/prepare-desktop-assets.mjs

      - name: Install Tauri CLI
        run: cargo install tauri-cli@2.11.2 --locked

      - name: Tauri build (debug)
        working-directory: crates/annex-desktop
        run: cargo tauri build --debug --bundles app
        env:
          ANNEX_BUILD_PROFILE: dev

  # Frontend tests
  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - run: npm ci
      # Typecheck before the tests, because vitest cannot fail on a type
      # error: it transpiles with esbuild, which strips types without
      # checking them. Verified locally by adding `const x: number = "s"` to
      # a source file — `tsc -b` fails and all 470 tests still pass. Without
      # this step the job is green on a tree that cannot be built, and the
      # error only surfaces later in the ui-audit or desktop lanes, where it
      # reads as an audit failure rather than as a type error.
      - run: npx tsc -b
      - run: npm test
      - run: npm run lint

  # Server smoke — boots annex-server with enforce_zk_proofs=true and
  # drives the full register → Merkle path → Groth16 proof →
  # verify-membership → authenticated channel-create flow against it.
  # Linux runner only because of the system libraries needed for the
  # release build profile; the Windows variant lives in
  # release-desktop.yml's pre-flight gates.
  smoke-server-linux:
    name: Smoke (Server, Linux)
    runs-on: ubuntu-latest
    needs: check-server
    env:
      ANNEX_SMOKE_PORT: 7321
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@3fc1e40d4c4ce3007de028907c886bc3996ce2ea # 1.96.0
      - name: Verify native codec build tools
        run: cmake --version

      - name: Install Linux DSP binding compiler
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libclang-dev

      - name: Verify native DSP binding compiler
        run: node scripts/verify-libclang.mjs

      - uses: Swatinem/rust-cache@v2
        with:
          key: smoke-server-linux

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: zk/package-lock.json

      - name: Verify and install pinned ZK artifacts
        run: |
          npm ci
          node scripts/verify-artifacts.js --all --profile production
          node scripts/install-ceremony.js
        working-directory: zk

      - name: Run server smoke
        run: bash scripts/smoke-server.sh

      # The live federation proof: a second server is played by
      # scripts/smoke-federation-relay.mjs, which signs a real
      # FederatedMessageEnvelope with a peer's Ed25519 key and relays it over
      # HTTP, and the server under test verifies signature, agreement and
      # membership before persisting and broadcasting it.
      #
      # It was referenced by nothing at all — no workflow, no script, no doc —
      # so the only end-to-end evidence that two servers federate ran when
      # somebody remembered it existed. Federation is a shipped feature with a
      # UI; this is its only cross-server test.
      - name: Run federation smoke
        run: bash scripts/smoke-federation.sh

  # The browser lane. Until this job existed, NOTHING in CI drove a real
  # browser: client/e2e/, client/e2e-puppeteer/ and scripts/e2e-server.sh were
  # referenced by zero workflows, so every UI regression had to be caught by
  # hand.
  #
  # The audit step below closed that for `--project=audit` only, and the
  # comment here claimed more than it did: the functional suite, the
  # group-call lane and the puppeteer harness went on running nowhere. All
  # three are steps in this job now.
  #
  # This job boots a real server with a fresh database, walks the surface
  # manifest, screenshots each surface at four viewports, and runs axe-core,
  # console/pageerror capture, failed-request capture, overflow detection and
  # the dialog keyboard contract against every one. Baselines committed under
  # client/e2e/audit/baselines/ are diffed, so an unintended visual change
  # fails here rather than shipping.
  #
  # Artifacts are uploaded on failure: the contact sheet plus the diagnostic
  # screenshots of anything the run could not reach are usually enough to
  # diagnose without reproducing locally.
  ui-audit:
    name: UI Audit (Linux)
    runs-on: ubuntu-latest
    needs: check-server
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@3fc1e40d4c4ce3007de028907c886bc3996ce2ea # 1.96.0
      - name: Verify native codec build tools
        run: cmake --version

      - name: Install Linux DSP binding compiler
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libclang-dev

      - name: Verify native DSP binding compiler
        run: node scripts/verify-libclang.mjs

      - uses: Swatinem/rust-cache@v2
        with:
          key: ui-audit

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install client deps
        run: npm ci
        working-directory: client

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
        working-directory: client

      # The audit drives a real in-browser Groth16 proof per role, so the
      # pinned circuits and keys have to exist before the server starts.
      - name: Verify and install pinned ZK artifacts
        run: |
          npm ci
          node scripts/verify-artifacts.js --all --profile production
          node scripts/install-ceremony.js
        working-directory: zk

      - name: Run UI audit
        run: bash scripts/ui-audit.sh

      # Later Playwright suites clear their output directories. Preserve the
      # audit's actual/diff frames before starting any of those suites.
      - name: Preserve UI audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-audit-report
          path: |
            docs/ui-audit/
            client/e2e/audit/diagnostics/
            client/e2e-results/
            client/e2e-report/
          retention-days: 30
          if-no-files-found: ignore

      # The functional lane — `client/e2e/*.spec.ts`, the `chromium` project.
      # It ran in NO workflow until this step: identity creation, server
      # selection, the in-browser Groth16 proof, channel join, send, edit,
      # delete, reply, admin channel CRUD and A-to-B delivery over the
      # WebSocket were all covered by a suite nothing executed. The audit lane
      # above is `--project=audit` and photographs screens; it asserts almost
      # nothing about behaviour.
      #
      # A fresh server per lane, because both need to be the first to register
      # (`ensure_founder` promotes the earliest registrant, and the audit's
      # roles are already in the database by now).
      - name: Functional browser suite
        id: functional-browser
        if: ${{ !cancelled() }}
        run: |
          bash scripts/e2e-server.sh start
          (cd client && npm run test:e2e)
          bash scripts/e2e-server.sh stop

      - name: Preserve functional browser evidence
        if: ${{ always() && steps.functional-browser.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: functional-browser-report
          path: |
            client/e2e-results/
            client/e2e-report/
          retention-days: 30
          if-no-files-found: ignore

      # The group-call lane. `16a76b7` rearchitected the SFU to one outbound
      # track per (receiver, sender) pair and deleted the test that existed to
      # fail when it landed; this is its replacement, and it was referenced by
      # no script, no workflow and no doc — it ran only if someone typed the
      # project name by hand. It holds a real multi-party call with fake media
      # devices, so it is minutes rather than seconds, and its failures mean
      # "a call cannot be held" rather than "a screen changed".
      - name: Group call lane
        id: group-call
        if: ${{ !cancelled() }}
        run: |
          bash scripts/e2e-server.sh start
          (cd client && npx playwright test --project=group-call --reporter=list)
          bash scripts/e2e-server.sh stop

      - name: Preserve group call evidence
        if: ${{ always() && steps.group-call.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: group-call-report
          path: |
            client/e2e-results/
            client/e2e-report/
          retention-days: 30
          if-no-files-found: ignore

      # The puppeteer harness. A second driver over the same journey — cold
      # start, identity, in-browser proof, chat, channel create — and it does
      # assert: `fail()` prints and exits 1, and the script ends with
      # `.catch((err) => fail(...))`. It was almost dismissed here as "a
      # screenshot tour with no assertions", which reading it disproved.
      #
      # It needs no browser of its own: `resolveChrome()` looks in
      # PLAYWRIGHT_BROWSERS_PATH, which the install step above populated.
      - name: Puppeteer journey
        if: ${{ !cancelled() }}
        run: |
          bash scripts/e2e-server.sh start
          (cd client && npm run test:e2e:puppeteer)
          bash scripts/e2e-server.sh stop

  # ── Supply chain ────────────────────────────────────────────────────────
  #
  # Nothing told this repository when a dependency picked up a CVE. `cargo
  # deny` covers advisories, licences and source registries in one pass; the
  # npm halves are audited at `high` and above, with the two contained chains
  # documented in CLAUDE.md's "snarkjs vulnerability containment" section.
  #
  # `continue-on-error` on the npm steps and NOT on cargo-deny is deliberate.
  # A new Rust advisory is actionable: the fix is a version bump. The npm
  # findings are a known, analysed, tree-shaken-out chain that cannot be
  # resolved without replacing snarkjs, so failing on them would train
  # everyone to ignore a red check — which is the failure mode this whole
  # branch has been unpicking. They are reported, not enforced, until the
  # chain is replaced.
  supply-chain:
    name: Supply chain (advisories, licences, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@3fc1e40d4c4ce3007de028907c886bc3996ce2ea # 1.96.0

      - name: Verify native codec build tools
        run: cmake --version

      - name: Install Linux DSP binding compiler
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libclang-dev

      - name: Verify native DSP binding compiler
        run: node scripts/verify-libclang.mjs

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: dependency-security
          workspaces: scripts/security-regressions -> target

      - name: Verify dependency source, runtime regressions, and audit
        run: |
          sudo apt-get update && sudo apt-get install -y libglib2.0-dev pkg-config
          bash scripts/check-dependency-security.sh

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            zk/package-lock.json

      # ── One of these three is a gate; the other two are reports ─────────
      #
      # Both audits were `continue-on-error: true`, so a new high never failed
      # anything and the job's green tick meant only that npm had been asked.
      # Making them blocking as they stand is not the fix either: the full
      # client audit reports 15 high/critical packages today — vite, vitest,
      # puppeteer, postcss, browserslist, undici — every one a devDependency
      # that never reaches a user, and an allowlist of fifteen entries would
      # need maintaining and would still fail every PR the day a new advisory
      # lands in vite.
      #
      # What DOES ship to a browser is `client`'s production dependency tree,
      # and measured on this commit it is clean at `--audit-level=high`. So that
      # one is a gate, with no allowlist to rot: a new high reaching the bundle's
      # dependency tree now fails CI.
      - name: npm audit (client production dependencies) — BLOCKING
        run: npm audit --omit=dev --audit-level=high
        working-directory: client

      # `zk`'s production tree carries 5 highs, all the
      # `snarkjs -> bfj -> jsonpath -> underscore` chain. CLAUDE.md's "snarkjs
      # vulnerability containment" section records the measurement: none of those
      # package names appear in `client/dist/assets/*.js`, because the proof
      # worker only calls `groth16.fullProve` and Vite tree-shakes the streaming
      # JSON parser out. The chain is reachable from Node-side tooling only —
      # build-time, not runtime traffic — and `zk/` is build tooling, marked
      # `"private": true`. Report, not gate, until snarkjs drops bfj.
      - name: npm audit (zk, full) — report only
        continue-on-error: true
        run: npm audit --audit-level=high
        working-directory: zk

      # The full client audit, for the devDependency picture. Report only, for
      # the reason above.
      - name: npm audit (client, full) — report only
        continue-on-error: true
        run: npm audit --audit-level=high
        working-directory: client

  # Desktop audit — journey stage 01, "app install".
  #
  # `check-desktop-linux` proves the bundle *builds*. This job proves the
  # bundle **installs and runs**: dpkg -i, the binary landing on PATH, the
  # `annex://` scheme handler being registered with the OS (without which
  # every invite link a user clicks goes nowhere), a headless launch that
  # survives startup, then dpkg -r and confirmed removal. None of that is
  # reachable from the browser lane, and all of it is the first thing a real
  # user touches.
  #
  # It also runs `cargo test -p annex-desktop`, which check-desktop-linux
  # deliberately skips — the script gates that on ~8 GB of free disk and
  # reports a skip rather than dying mid-link, so a tight runner degrades
  # instead of failing.
  desktop-audit:
    name: Desktop Audit (install → launch → uninstall)
    runs-on: ubuntu-latest
    needs: check-desktop-linux
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@3fc1e40d4c4ce3007de028907c886bc3996ce2ea # 1.96.0
        with:
          components: clippy
      - name: Verify native codec build tools
        run: cmake --version

      - name: Install Linux DSP binding compiler
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libclang-dev

      - name: Verify native DSP binding compiler
        run: node scripts/verify-libclang.mjs

      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop-audit

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libclang-dev \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libpipewire-0.3-dev \
            patchelf \
            xvfb

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            client/package-lock.json
            zk/package-lock.json

      - name: Install client dependencies
        run: npm ci
        working-directory: client

      # The bundler declares zk/keys/membership_vkey.json as a resource and
      # validates it at build time, so the keys have to exist first.
      - name: Verify and install pinned ZK artifacts
        run: |
          npm ci
          node scripts/verify-artifacts.js --all --profile production
          node scripts/install-ceremony.js
        working-directory: zk

      - name: Prepare pinned native desktop resources
        run: node scripts/prepare-desktop-assets.mjs

      - name: Install Tauri CLI
        run: cargo install tauri-cli@2.11.2 --locked

      - name: Run desktop audit
        run: bash scripts/desktop-audit.sh

      - name: Upload launch log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-audit-launch-log
          path: /tmp/annex-desktop-launch.log
          retention-days: 14
          if-no-files-found: ignore

  # Server smoke — Windows. Same flow as the Linux smoke, exercised on
  # PowerShell so the .ps1 doesn't regress.
  smoke-server-windows:
    name: Smoke (Server, Windows)
    runs-on: windows-latest
    needs: check-server
    env:
      ANNEX_SMOKE_PORT: 7321
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@3fc1e40d4c4ce3007de028907c886bc3996ce2ea # 1.96.0
      - name: Verify native codec build tools
        run: cmake --version

      - name: Install Linux DSP binding compiler
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libclang-dev

      - name: Verify native DSP binding compiler
        run: node scripts/verify-libclang.mjs

      - uses: Swatinem/rust-cache@v2
        with:
          key: smoke-server-windows

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: zk/package-lock.json

      - name: Verify and install pinned ZK artifacts
        shell: bash
        run: |
          npm ci
          node scripts/verify-artifacts.js --all --profile production
          node scripts/install-ceremony.js
        working-directory: zk

      - name: Run server smoke
        shell: pwsh
        run: pwsh ./scripts/smoke-server.ps1
