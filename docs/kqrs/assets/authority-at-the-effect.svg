<text x="162" y="60" fill="#202024" font-family="Kuykendall Web Text, sans-serif" font-weight="400" font-size="8.6">Principal / scope / purpose</text>
<text x="162" y="72" fill="#202024" font-family="Kuykendall Web Text, sans-serif" font-weight="400" font-size="8.6">Expiry / policy / action digest</text>
