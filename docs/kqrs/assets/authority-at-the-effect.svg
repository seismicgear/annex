<svg xmlns="http://www.w3.org/2000/svg" width="514" height="540" viewBox="0 0 514 540" role="img" aria-labelledby="title desc">
<title id="title">Authority at the effect</title>
<desc id="desc">Five action states: authority, admission, queue or retry, commit, receipt. An independent current authority rail and content lineage rail are checked at the boundaries. A destination oracle observes actual effects. Changes to essential dependencies invalidate evidence and claims.</desc>
