<text x="162" y="244" fill="#202024" font-family="Kuykendall Web Text, sans-serif" font-weight="400" font-size="8.6">Revalidate after wait or retry.</text>
<text x="162" y="256" fill="#202024" font-family="Kuykendall Web Text, sans-serif" font-weight="400" font-size="8.6">Preserve lease / generation.</text>
