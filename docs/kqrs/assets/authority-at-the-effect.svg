<text x="0" y="170" fill="#686870" font-family="Kuykendall Web Text, sans-serif" font-weight="700" font-size="7.4">BOUNDARY CHECKS</text>
<text x="0" y="188.0" fill="#202024" font-family="Kuykendall Web Text, sans-serif" font-weight="400" font-size="8.25">Restrictions survive</text>
<text x="0" y="199.7" fill="#202024" font-family="Kuykendall Web Text, sans-serif" font-weight="400" font-size="8.25">extraction, summarization,</text>
<text x="0" y="211.39999999999998" fill="#202024" font-family="Kuykendall Web Text, sans-serif" font-weight="400" font-size="8.25">storage and replay.</text>
<text x="0" y="270" fill="#686870" font-family="Kuykendall Web Text, sans-serif" font-weight="700" font-size="7.1">DURABLE UNCERTAINTY</text>
<text x="0" y="288.0" fill="#202024" font-family="Kuykendall Web Text, sans-serif" font-weight="400" font-size="8.05">Record an unknown</text>
<text x="0" y="299.7" fill="#202024" font-family="Kuykendall Web Text, sans-serif" font-weight="400" font-size="8.05">outcome before an external</text>
<text x="0" y="311.4" fill="#202024" font-family="Kuykendall Web Text, sans-serif" font-weight="400" font-size="8.05">effect can outlive its receipt.</text>
<rect x="390" y="217" width="124" height="150" fill="#f6f6f7" stroke="#d9d9de" stroke-width="0.65"/>
<text x="400" y="236" fill="#d00000" font-family="Kuykendall Web Text, sans-serif" font-weight="700" font-size="8">EFFECT ORACLE</text>
<text x="400" y="256" fill="#202024" font-family="Kuykendall Web Text, sans-serif" font-weight="400" font-size="8.1">Observe protected state</text>
<text x="400" y="268" fill="#202024" font-family="Kuykendall Web Text, sans-serif" font-weight="400" font-size="8.1">at the destination:</text>
<text x="400" y="280" fill="#202024" font-family="Kuykendall Web Text, sans-serif" font-weight="400" font-size="8.1">files, database, network,</text>
<text x="400" y="292" fill="#202024" font-family="Kuykendall Web Text, sans-serif" font-weight="400" font-size="8.1">recipient-visible results.</text>
<text x="400" y="304" fill="#202024" font-family="Kuykendall Web Text, sans-serif" font-weight="400" font-size="8.1"></text>
<text x="400" y="316" fill="#202024" font-family="Kuykendall Web Text, sans-serif" font-weight="400" font-size="8.1">Report what applied,</text>
<text x="400" y="328" fill="#202024" font-family="Kuykendall Web Text, sans-serif" font-weight="400" font-size="8.1">including uncertainty.</text>
