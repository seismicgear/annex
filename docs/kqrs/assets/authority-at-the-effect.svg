<text x="162" y="336" fill="#202024" font-family="Kuykendall Web Text, sans-serif" font-weight="400" font-size="8.6">Authorize the actual effect.</text>
<text x="162" y="348" fill="#202024" font-family="Kuykendall Web Text, sans-serif" font-weight="400" font-size="8.6">Order revocation against commit.</text>
