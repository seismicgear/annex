# Production Compose for Annex.
#
# `docker-compose.yml` is labelled DEV/LOCAL ONLY at the top of the file and
# means it: wildcard CORS, `ANNEX_BUILD_PROFILE=dev`, dev-fixture ZK keys. It
# is the right file for local work and it was also the only file, so
# `deploy.sh --mode docker` — the default mode — pointed a "deployment" at it.
#
# This one is the other half. Differences that matter:
#
#   * `ANNEX_BUILD_PROFILE=production`, so every gate is live: an explicit CORS
#     origin list is required, ZK enforcement cannot be switched off, and weak
#     or ephemeral signing keys are refused at startup.
#   * A healthcheck, so an orchestrator can tell a running container from a
#     working one.
#   * Resource limits, a read-only root filesystem, dropped capabilities and
#     `no-new-privileges`. None of these are exotic; all were absent.
#   * Log rotation, because the default json-file driver grows without bound
#     and filling the disk is how the storage gate gets exercised for real.
#   * A backup sidecar, because `scripts/backup.sh` is only a backup if
#     something runs it.
#
# Usage:
#   ANNEX_CORS_ORIGINS=https://annex.example.com \
#   ANNEX_PUBLIC_URL=https://annex.example.com \
#     docker compose -f docker-compose.prod.yml up -d
#
# Put TLS in front of it. The server speaks HTTP only, by design; see
# docs/deployment.md.

services:
  annex:
    build:
      context: .
      args:
        # Production here selects the ZK path that VERIFIES pinned artifacts
        # instead of generating dev fixtures, and arms the supply-chain pins
        # for Piper and whisper.cpp. Those two need digests supplied:
        #   --build-arg PIPER_SHA256=... --build-arg WHISPER_CPP_COMMIT=...
        ANNEX_BUILD_PROFILE: production
    image: annex:production
    restart: unless-stopped

    environment:
      ANNEX_BUILD_PROFILE: production
      ANNEX_HOST: 0.0.0.0          # inside the container; publish selectively below
      ANNEX_PORT: 3000
      ANNEX_DB_PATH: /app/data/annex.db
      ANNEX_LOG_LEVEL: ${ANNEX_LOG_LEVEL:-info}
      ANNEX_LOG_JSON: ${ANNEX_LOG_JSON:-true}
      # Required. The server refuses to start under a production profile with
      # an empty or wildcard origin list, which is the point.
      ANNEX_CORS_ORIGINS: ${ANNEX_CORS_ORIGINS:?set ANNEX_CORS_ORIGINS to your real origin(s)}
      ANNEX_PUBLIC_URL: ${ANNEX_PUBLIC_URL:?set ANNEX_PUBLIC_URL to the externally reachable https URL}
      # Size cap for the database, so the storage gate has something to gate
      # against. Without it the two headroom thresholds do nothing.
      ANNEX_STORAGE_MAX_DB_BYTES: ${ANNEX_STORAGE_MAX_DB_BYTES:-10737418240}

    # Bound to loopback: TLS termination belongs to the reverse proxy, and a
    # container that publishes 3000 on 0.0.0.0 is serving plaintext HTTP to the
    # internet.
    ports:
      - "127.0.0.1:3000:3000"

    volumes:
      - annex-data:/app/data
      # Optional: a GGML model enables STT. None is bundled; see
      # docs/deployment.md.
      # - ./models:/app/assets/models:ro

    # The server writes only to /app/data. Everything else can be immutable.
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/readyz"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 3

    deploy:
      resources:
        limits:
          memory: 2g
        reservations:
          memory: 512m

    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  # A backup nobody runs is a belief. This runs `scripts/backup.sh` daily
  # against the same volume, keeps 14 archives, and verifies each one it
  # writes — including the signing key, which the old manual procedure did not
  # copy at all.
  backup:
    image: annex:production
    restart: unless-stopped
    depends_on:
      annex:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          sh /app/scripts/backup.sh --data-dir /app/data --out /backups --keep 14 || \
            echo "[backup] FAILED — the next run will try again, but investigate." >&2
          sleep 86400
        done
    volumes:
      # Read-write, deliberately. `sqlite3 .backup` against a WAL database
      # needs to open the source read-write — it creates the `-shm` file that
      # makes a consistent snapshot of a LIVE database possible, which is the
      # whole reason this is not a `cp`. A read-only mount fails at that step,
      # and it fails in a way that reads like a permissions problem.
      - annex-data:/app/data
      - annex-backups:/backups
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  annex-data:
  annex-backups:
