# Compile the exact verified vendored source, including its private wire tests.
# Dependency declarations below retain the published 0.10.0 manifest requirements.
[package]
name = "annex-dtls-regressions"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[lib]
path = "../../vendor/webrtc-dtls/src/lib.rs"

[profile.dev]
debug = 0

[dependencies.aes]
version = "0.8"

[dependencies.aes-gcm]
version = "0.10"

[dependencies.async-trait]
version = "0.1"

[dependencies.bincode]
version = "1"

[dependencies.byteorder]
version = "1"

[dependencies.cbc]
version = "0.1"
features = [
    "block-padding",
    "alloc",
]

[dependencies.ccm]
version = "0.5"

[dependencies.der-parser]
version = "8.1"

[dependencies.hkdf]
version = "0.12"

[dependencies.hmac]
version = "0.12"

[dependencies.log]
version = "0.4"

[dependencies.p256]
version = "0.13"
features = [
    "default",
    "ecdh",
    "ecdsa",
]

[dependencies.p384]
version = "0.13"

[dependencies.pem]
version = "3"
optional = true

[dependencies.portable-atomic]
version = "1.6"

[dependencies.rand]
version = "0.8"

[dependencies.rand_core]
version = "0.6"

[dependencies.rcgen]
version = "0.13"

[dependencies.ring]
version = "0.17"

[dependencies.rustls]
version = "0.23"
features = [
    "std",
    "ring",
]
default-features = false

[dependencies.sec1]
version = "0.7"
features = ["std"]

[dependencies.serde]
version = "1"
features = ["derive"]

[dependencies.sha1]
version = "0.10"

[dependencies.sha2]
version = "0.10"

[dependencies.subtle]
version = "2"

[dependencies.thiserror]
version = "1"

[dependencies.tokio]
version = "1.32.0"
features = [
    "fs",
    "io-util",
    "io-std",
    "macros",
    "net",
    "parking_lot",
    "rt",
    "rt-multi-thread",
    "sync",
    "time",
]

[dependencies.util]
version = "0.9.0"
features = ["conn"]
default-features = false
package = "webrtc-util"

[dependencies.x25519-dalek]
version = "2"
features = ["static_secrets"]

[dependencies.x509-parser]
version = "0.16"

[dev-dependencies.chrono]
version = "0.4.28"

[dev-dependencies.clap]
version = "3"

[dev-dependencies.env_logger]
version = "0.10"

[dev-dependencies.tokio-test]
version = "0.4"

[features]
pem = ["dep:pem"]
