[package]
name = "annex-federation"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
annex-types = { workspace = true }
annex-db = { workspace = true }
annex-rtx = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
annex-vrp = { workspace = true }
rusqlite = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true, features = ["json"] }
tokio = { workspace = true }
tokio-util = { workspace = true }
webrtc = "0.11"
futures-util = "0.3"
uuid = { workspace = true }
chrono = { workspace = true }
# Content-blind signaling: seal the SDP so the rendezvous never sees ICE/IPs.
ed25519-dalek = { version = "2", features = ["rand_core"] }
x25519-dalek = { version = "3", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
hkdf = "0.13"
# HKDF 0.13 uses digest 0.11; preserve other hashes on the existing API.
sha2_11 = { package = "sha2", version = "0.11" }
sha2 = { workspace = true }
rand = "0.8"
base64 = "0.22"
hex = "0.4"
zeroize = "1"
url = "2"
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-native-roots"] }
