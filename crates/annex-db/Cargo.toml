[package]
name = "annex-db"
version.workspace = true
edition.workspace = true

[dependencies]
annex-types = { workspace = true }
rusqlite = { workspace = true }
r2d2 = { workspace = true }
r2d2_sqlite = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
# Migration integrity checksums (introduced in migration 039).
sha2 = { workspace = true }

[dev-dependencies]
tempfile = "3"
# Migration 046 rewrites a field inside `servers.policy_json`; its tests
# build the before-state as a real `ServerPolicy` rather than a JSON
# literal that could drift from the struct.
serde_json = { workspace = true }
