[package]
name = "annex-desktop"
version.workspace = true
edition.workspace = true
description = "Annex desktop application — Tauri wrapper for the Annex server and client."

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
annex-server = { path = "../annex-server" }
axum = { workspace = true }
tauri = { version = "2", features = [] }
tauri-plugin-deep-link = "2"
url = "2"
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
dirs = "6"
reqwest = { workspace = true }
rfd = "0.15"

toml = { workspace = true }
uuid = { workspace = true }
keyring = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
annex-voice = { path = "../annex-voice" }

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
webview2-com = "0.38"
windows = { version = "0.61", features = ["Win32_System_WinRT"] }
