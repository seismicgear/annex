[package]
name = "annex-desktop"
version.workspace = true
edition.workspace = true
description = "Annex desktop application — Tauri wrapper for the Annex server and client."

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
annex-server = { path = "../annex-server" }
axum = { workspace = true }
tauri = { version = "2", features = [] }
tauri-plugin-deep-link = "2"
# In-app update checking. The bundles it consumes are produced only when the
# release workflow is given a signing key (see .github/workflows/
# release-desktop.yml); without one, `plugins.updater` is absent from the
# built config and `check()` reports no configured endpoint rather than
# pretending to be up to date.
tauri-plugin-updater = "2"
# Required for deep links to reach a RUNNING instance on Linux and Windows.
# Without it the OS starts a second process — see main.rs.
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
url = "2"
tokio = { workspace = true }
tokio-util = { workspace = true }
futures-util = "0.3"
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
dirs = "6"
reqwest = { workspace = true }
rfd = "0.15"

toml = { workspace = true }
uuid = { workspace = true }
keyring = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
annex-voice = { path = "../annex-voice" }

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
webview2-com = "0.38"
windows = { version = "0.61", features = ["Win32_System_WinRT"] }
windows-core = "0.61"
