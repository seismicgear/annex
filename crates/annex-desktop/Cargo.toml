[package]
name = "annex-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Annex desktop application — Tauri wrapper for the Annex server and client."

[features]
# Enables the embedded frontend for packaged builds and native acceptance;
# development without this feature continues to use Tauri's Vite dev URL.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
annex-server = { path = "../annex-server", version = "=0.1.2" }
annex-federation = { workspace = true }
axum = { workspace = true }
tauri = { version = "2", features = [] }
tauri-plugin-deep-link = "2"
# In-app update checking. The bundles it consumes are produced only when the
# release workflow is given a signing key (see .github/workflows/
# release-desktop.yml); without one, `plugins.updater` is absent from the
# built config and `check()` reports no configured endpoint rather than
# pretending to be up to date.
tauri-plugin-updater = "2"
# Required for deep links to reach a RUNNING instance on Linux and Windows.
# Without it the OS starts a second process — see main.rs.
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
url = "2"
tokio = { workspace = true }
tokio-util = { workspace = true }
futures-util = "0.3"
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
dirs = "6"
reqwest = { workspace = true }
rusqlite = { workspace = true }
base64 = "0.22"
hex = "0.4"
sha2 = { workspace = true }
rand = "0.8"
ed25519-dalek = "2"
# Match the desktop's platform certificate trust without introducing a second
# bundled Mozilla root-data generation solely for this connection.
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-native-roots"] }
tempfile = { workspace = true }
rfd = "0.17"

toml = { workspace = true }
uuid = { workspace = true }
keyring = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tracing-subscriber = { workspace = true }
annex-voice = { path = "../annex-voice", version = "=0.1.2" }

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
# Keep COM interface types aligned with Tauri/Wry's WebView2 controller.
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_System_WinRT"] }
windows-core = "0.62"

[target.'cfg(target_os = "linux")'.dependencies]
# deep-link 2.6.2 constructs the two-field ParseOption from this release.
# rust-ini 0.21.2+ added public fields without a compatible struct initializer.
rust-ini = "=0.21.1"
